<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LocaObra — Gestão de Locação de Equipamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --charcoal:#141414;
  --charcoal-2:#232323;
  --steel:#4A4E57;
  --amber:#f59e0b;
  --amber-dark:#d97706;
  --brand-green:#4C9A1C;
  --brand-blue:#1D3F73;
  --concrete:#EDEAE3;
  --concrete-2:#F7F5F0;
  --ink:#1A1A1A;
  --ink-soft:#5B5F66;
  --green:#2F9E6E;
  --red:#D64545;
  --line:#DDD8CE;
  --radius:6px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--concrete);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  letter-spacing:0.02em;
  text-transform:uppercase;
}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---- faixa de obra na cor da locadora ---- */
.hazard{
  height:6px;
  background:repeating-linear-gradient(135deg,
    var(--charcoal) 0 10px,
    var(--amber) 10px 20px);
}

/* ---- layout ---- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:220px; background:var(--charcoal); color:var(--concrete-2);
  flex-shrink:0; display:flex; flex-direction:column;
}
.brand{
  padding:22px 20px 16px; border-bottom:1px solid #34373B;
}
.brand .display{font-size:26px; color:var(--amber); line-height:1;}
.brand .sub{font-size:11px; color:#9CA0A8; letter-spacing:0.08em; margin-top:2px;}
nav{padding:14px 10px; flex:1;}
nav button{
  display:flex; align-items:center; gap:10px; width:100%;
  background:none; border:none; color:#C9CCD1; text-align:left;
  padding:11px 12px; border-radius:var(--radius); font-size:14px; font-weight:500;
  cursor:pointer; margin-bottom:2px; transition:background .15s;
}
nav button:hover{background:#2C2F34;}
nav button.active{background:var(--amber); color:var(--charcoal); font-weight:700;}
nav .icon{width:18px; text-align:center; font-size:15px;}

.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  background:var(--concrete-2); border-bottom:1px solid var(--line);
  padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
}
.topbar h1{font-size:24px; color:var(--ink);}
.content{padding:26px 28px 60px; overflow-y:auto;}

/* ---- cards / stats ---- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-2{grid-template-columns:1fr;} .sidebar{width:70px;} .brand .display{display:none;} nav button span.label{display:none;}}

.stat{
  background:var(--concrete-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; position:relative; overflow:hidden;
}
.stat::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--amber);}
.stat .num{font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:var(--ink);}
.stat .lbl{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}
.stat.warn::before{background:var(--red);}
.stat.ok::before{background:var(--green);}

.panel{
  background:var(--concrete-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:18px;
}
.panel h2{font-size:19px; margin-bottom:14px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.panel h2 .tag{
  font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--amber); color:var(--charcoal);
  padding:2px 6px; border-radius:3px; text-transform:none; letter-spacing:0;
}

/* ---- forms ---- */
label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px;}
input,select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
  font-family:'Inter',sans-serif; font-size:14px; background:#fff; color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
.field{margin-bottom:13px;}
.row{display:flex; gap:12px;}
.row > *{flex:1;}

button.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
  border:none; border-radius:var(--radius); padding:10px 18px; transition:transform .1s, opacity .15s;
}
button.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--amber); color:var(--charcoal);}
.btn-primary:hover{background:var(--amber-dark);}
.btn-dark{background:var(--charcoal); color:#fff;}
.btn-dark:hover{opacity:0.85;}
.btn-outline{background:none; border:1.5px solid var(--charcoal); color:var(--charcoal);}
.btn-outline:hover{background:var(--charcoal); color:#fff;}
.btn-sm{padding:6px 12px; font-size:12.5px;}
a.btn{text-decoration:none; display:inline-flex; align-items:center; justify-content:center;}
.btn-danger{background:none; color:var(--red); border:1.5px solid var(--red);}
button.btn.btn-outline{border:1.5px solid var(--charcoal);}
button.btn.btn-danger{border:1.5px solid var(--red);}

/* ---- table ---- */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:9px 10px; background:var(--charcoal); color:var(--concrete-2);
  font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; font-size:12px; letter-spacing:0.04em;
}
th:first-child{border-radius:5px 0 0 0;} th:last-child{border-radius:0 5px 0 0;}
td{padding:9px 10px; border-bottom:1px solid var(--line);}
tr:hover td{background:#F2EFE8;}

.badge{
  display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.03em;
}
.badge-ok{background:#E1F3EA; color:var(--green);}
.badge-warn{background:#FDEBD3; color:var(--amber-dark);}
.badge-bad{background:#FBE4E4; color:var(--red);}
.badge-neutral{background:#E8E6E0; color:var(--ink-soft);}

.pix-fundo{position:fixed; inset:0; background:rgba(20,20,22,.55); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto;}
.pix-caixa{background:#fff; border-radius:10px; width:100%; max-width:460px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.pix-caixa h2{font-size:18px; margin-bottom:2px;}
.pix-topo{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.pix-fechar{background:none; border:none; font-size:26px; line-height:1; cursor:pointer; color:var(--ink-soft);}
.pix-qr{display:block; margin:6px auto 10px; width:220px; height:220px; image-rendering:pixelated;}
.pix-copia{width:100%; font-family:'JetBrains Mono',monospace; font-size:11px; padding:8px; border:1px solid var(--line); border-radius:6px; resize:none; height:64px; background:#F7F5F0;}
.pix-valor{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; text-align:center;}
.pix-hist{margin-top:14px; border-top:1px solid var(--line); padding-top:10px; font-size:13px;}
.pix-hist div{display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line);}
.pix-abas{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.pix-abas label{border:1.5px solid var(--line); border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:600; color:var(--ink);}
.pix-abas input{display:none;}
.pix-abas input:checked + span{color:var(--amber-dark);}
.pix-abas label:has(input:checked){border-color:var(--amber); background:#FFF6F6;}
.pix-passos{font-size:13px; color:var(--ink-soft); margin:0 0 12px 18px;}
.pix-passos li{margin-bottom:4px;}
.ilu{flex-shrink:0; display:inline-block; vertical-align:middle;}
.fer-nome{display:inline-flex; align-items:center; gap:8px;}
.item-row{display:flex; gap:10px; align-items:end; margin-bottom:10px; padding:10px; background:#F7F5F0; border-radius:var(--radius); border:1px dashed var(--line);}
.item-row select, .item-row input{flex:1;}
.item-row .qty{max-width:70px;}
.item-row button{flex-shrink:0;}

.summary-box{
  background:var(--charcoal); color:#fff; border-radius:var(--radius); padding:16px 18px; margin-top:14px;
}
.summary-box .row{justify-content:space-between; margin-bottom:6px; font-size:14px;}
.summary-box .row > *{flex:0 1 auto;}
.summary-box .total{font-family:'JetBrains Mono',monospace; font-size:22px; color:var(--amber); font-weight:700;}

.empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
.empty .display{font-size:20px; color:var(--steel); margin-bottom:6px;}

.toast{
  position:fixed; bottom:20px; right:20px; background:var(--charcoal); color:#fff;
  padding:12px 18px; border-radius:var(--radius); font-size:14px; z-index:999;
  border-left:4px solid var(--amber); box-shadow:0 6px 18px rgba(0,0,0,0.25);
  display:none;
}
.hidden{display:none !important;}
.actions-cell{display:flex; gap:6px;}
.config-note{font-size:12.5px; color:var(--ink-soft); background:#FDEBD3; border:1px solid #F0D19A; padding:10px 12px; border-radius:var(--radius); margin-bottom:16px;}

/* ---- login screen ---- */
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--charcoal);
}
.login-card{
  width:100%; max-width:360px; background:var(--concrete-2); border-radius:var(--radius);
  padding:32px 30px; box-shadow:0 20px 50px rgba(0,0,0,0.35); position:relative; overflow:hidden;
}
.login-card::before{content:''; position:absolute; left:0; top:0; right:0; height:5px; background:var(--amber);}
.login-card .display{font-size:30px; color:var(--amber); text-align:center; margin-bottom:2px;}
.login-card .sub{font-size:12px; color:var(--ink-soft); text-align:center; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:24px;}
.login-card .field{margin-bottom:14px;}
.login-card button{width:100%; margin-top:6px;}
.login-error{color:var(--red); font-size:13px; margin-top:10px; display:none;}
.login-switch{display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--ink-soft);}
.login-switch a{color:var(--ink); font-weight:600; cursor:pointer; text-decoration:underline;}
.brand-nome{font-family:'Bebas Neue','Archivo Black',sans-serif; font-size:24px; color:var(--amber); line-height:1.05; word-break:break-word;}
.brand-sub{font-size:10.5px; color:#9CA0A8; letter-spacing:0.08em; margin-top:4px; text-transform:uppercase;}
.wordmark{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px;}
.wordmark svg{width:40px; height:40px;}
.wordmark span{font-family:'Bebas Neue','Archivo Black',sans-serif; font-size:34px; color:var(--ink); letter-spacing:0.02em;}
.logo-preview{max-width:180px; max-height:90px; display:block; margin:8px 0; border:1px solid var(--line); border-radius:6px; background:#fff; padding:4px;}
.aviso-plano{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:var(--radius); margin-bottom:16px; font-size:14px; border:1px solid;}
.aviso-plano.alerta{background:#FDEBD3; border-color:#F0D19A; color:var(--ink);}
.aviso-plano.bloqueio{background:#FBE4E4; border-color:#E9A9A9; color:#7A1A1A;}
.aviso-plano .acoes{display:flex; gap:8px; flex-wrap:wrap;}
.planos-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:14px 0;}
.plano-card{border:2px solid var(--line); border-radius:10px; padding:16px; background:#fff; cursor:pointer; position:relative;}
.plano-card.sel{border-color:var(--amber); box-shadow:0 0 0 3px color-mix(in srgb, var(--amber) 20%, transparent);}
.plano-card h3{font-size:18px; margin-bottom:4px;}
.plano-card .preco{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; margin:6px 0;}
.plano-card .preco small{font-size:13px; font-weight:400; color:var(--ink-soft);}
.plano-card ul{margin:8px 0 0 18px; font-size:13.5px; color:var(--ink-soft);}
.plano-card .selo{position:absolute; top:-10px; right:12px; background:var(--amber); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em;}
.ciclo-toggle{display:inline-flex; border:1px solid var(--line); border-radius:99px; overflow:hidden;}
.ciclo-toggle button{border:none; background:none; padding:7px 16px; cursor:pointer; font:inherit; font-size:13.5px;}
.ciclo-toggle button.on{background:var(--charcoal); color:#fff;}
.status-plano{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:6px;}
.status-plano div{background:var(--concrete-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
.status-plano b{display:block; font-size:15px; margin-top:2px;}
.teste-aviso{font-size:12.5px; background:#FDEBD3; border:1px solid #F0D19A; color:var(--ink); padding:8px 12px; border-radius:var(--radius); margin-bottom:14px;}
.logout-btn{
  width:100%; margin:0; padding:9px 12px; border-radius:var(--radius); background:none; border:1px solid #3A3D42;
  color:#9CA0A8; font-size:12.5px; cursor:pointer; text-align:left;
}
.logout-btn:hover{background:#2C2F34; color:#fff;}
.logo-mark{width:64px; height:64px; display:block; margin:0 auto 10px;}
.logo-mark-sm{width:38px; height:38px; margin:0 0 8px;}
.logo-mark-img{width:100%; max-width:220px; height:auto; display:block; margin:0 auto 14px; border-radius:8px;}
.logo-mark-sm-img{width:100%; max-width:150px; height:auto; display:block; margin:0 0 10px; border-radius:6px;}
.dev-signature{
  text-align:center; font-size:10.5px; color:var(--ink-soft); letter-spacing:0.03em;
  margin-top:20px; padding-top:14px; border-top:1px solid var(--line);
}
.sidebar-footer{padding:0 10px 14px;}
.dev-signature-sidebar{
  color:#6B6F76; font-size:9.5px; text-align:left; margin-top:8px; padding:0 2px;
  border-top:none;
}
.topbar-logout{display:none;}
@media(min-width:769px){
  .panel{overflow-x:auto;}
  td.actions-cell{display:table-cell; min-width:180px;}
  td.actions-cell .btn{margin:2px 0 2px 4px;}
}

/* ======================================================
   CELULAR (até 768px) — menu inferior, tabelas em cartões
   ====================================================== */
@media(max-width:768px){
  .app{flex-direction:column;}

  /* menu lateral vira barra fixa no rodapé */
  .sidebar{
    position:fixed; left:0; right:0; bottom:0; width:100%; z-index:100;
    flex-direction:row; border-top:3px solid var(--amber);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 16px rgba(0,0,0,0.25);
  }
  .brand, .sidebar-footer{display:none;}
  nav{display:flex; padding:4px; gap:2px;}
  nav button{
    flex:1; flex-direction:column; justify-content:center; gap:3px;
    padding:8px 2px; margin:0; font-size:9.5px; text-align:center; min-width:0;
  }
  nav button.active{font-weight:600;}
  nav button span.label{display:block !important; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  nav .icon{font-size:18px; width:auto;}

  .topbar{padding:12px 16px; gap:10px;}
  .topbar h1{font-size:20px;}
  .topbar-actions{display:flex; gap:6px; flex-shrink:0;}
  .topbar-logout{
    display:block; background:none; border:1.5px solid var(--charcoal); color:var(--charcoal);
    border-radius:var(--radius); padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; flex-shrink:0;
  }
  .content{padding:16px 14px calc(96px + env(safe-area-inset-bottom));}

  /* cartões e painéis */
  .grid{gap:10px;}
  .panel{padding:16px 14px; margin-bottom:14px;}
  .panel h2{font-size:17px;}
  .stat{padding:12px 14px;}
  .stat .num{font-size:20px; word-break:break-word;}
  .stat .lbl{font-size:11px;}
  #lista-comuns{grid-template-columns:1fr 1fr;}

  /* formulários empilhados; 16px evita zoom automático no iPhone */
  input,select,textarea{font-size:16px; padding:11px 12px;}
  .row{flex-direction:column; gap:0;}
  .row > .field{max-width:none !important;}
  .summary-box .row{flex-direction:row; gap:12px;}
  form button.btn, #resumo button.btn{flex:1;}
  button.btn{min-height:42px;}
  .btn-sm{min-height:36px;}

  .item-row{flex-wrap:wrap;}
  .item-row select{flex:1 1 100%;}
  .item-row .qty{max-width:none; flex:1;}

  /* tabelas viram cartões empilhados */
  table, thead, tbody, tr, td{display:block; width:100%;}
  thead{display:none;}
  tr{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:6px 12px; margin-bottom:10px; border-left:4px solid var(--amber);
  }
  tr:hover td{background:none;}
  td{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:8px 0; border-bottom:1px dashed var(--line); text-align:right; word-break:break-word;
  }
  td::before{
    content:attr(data-label); flex-shrink:0; text-align:left;
    font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;
  }
  td:last-child{border-bottom:none;}
  td.actions-cell, td[data-label=""]{justify-content:flex-start; flex-wrap:wrap; gap:6px; padding-top:10px;}
  td.actions-cell::before, td[data-label=""]::before{display:none;}
  td.actions-cell .btn{flex:1 1 auto;}

  .toast{left:14px; right:14px; bottom:calc(84px + env(safe-area-inset-bottom)); text-align:center;}
  .login-wrap{padding:16px;}
  .login-card{padding:28px 20px;}
}
</style>
</head>
<body>

<div class="login-wrap hidden" id="login-screen">
  <div class="login-card">
    <div class="wordmark"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#141414"/><path d="M9 29h22M13 29V15l7-5 7 5v14" fill="none" stroke="var(--amber)" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 29v-7h6v7" fill="none" stroke="#fff" stroke-width="2.2"/></svg><span>LocaObra</span></div>
    <div class="sub">Gestão de locação de equipamentos</div>
    <form id="form-login">
      <div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="login-senha">Senha</label><input id="login-senha" type="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <div class="login-error" id="login-error">E-mail ou senha inválidos.</div>
      <span class="login-switch">Ainda não usa o LocaObra? <a id="ir-cadastro">Criar conta da minha locadora</a></span>
    </form>
    <form id="form-cadastro" class="hidden">
      <div class="field"><label for="cad-empresa">Nome da locadora</label><input id="cad-empresa" required minlength="2" autocomplete="organization"></div>
      <div class="field"><label for="cad-nome">Seu nome</label><input id="cad-nome" autocomplete="name"></div>
      <div class="field"><label for="cad-telefone">WhatsApp da locadora</label><input id="cad-telefone" inputmode="tel" placeholder="(11) 99999-9999"></div>
      <div class="field"><label for="cad-cidade">Cidade</label><input id="cad-cidade"></div>
      <div class="field"><label for="cad-email">E-mail de acesso</label><input id="cad-email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="cad-senha">Senha</label><input id="cad-senha" type="password" required minlength="8" autocomplete="new-password" placeholder="mínimo 8 caracteres"></div>
      <button type="submit" class="btn btn-primary">Criar conta e começar o teste grátis</button>
      <div class="login-error" id="cad-error"></div>
      <span class="login-switch">Já tem conta? <a id="ir-login">Entrar</a></span>
    </form>
    <div class="dev-signature">Desenvolvido por Foster Tech Soluções</div>
  </div>
</div>

<div class="app hidden" id="app-shell">
  <div class="sidebar">
    <div class="brand">
      <img class="logo-mark logo-mark-sm-img hidden" id="brand-logo" alt="">
      <div class="brand-nome" id="brand-nome">LocaObra</div>
      <div class="brand-sub" id="brand-sub">Locação de equipamentos</div>
    </div>
    <nav>
      <button class="nav-btn active" data-view="dashboard"><span class="icon">▦</span><span class="label">Dashboard</span></button>

   BACKEND — Cloudflare Worker + D1 (substitui o Supabase)

const API_BASE_URL = 'https://locaobra-worker.fosterconstrutora.workers.dev';

function createCustomClient(baseUrl){
  function getToken(){ return localStorage.getItem('lo_session') || null; }
  function setToken(t){ if(t) localStorage.setItem('lo_session', t); else localStorage.removeItem('lo_session'); }
  function authHeaders(){
    const h = {'Content-Type':'application/json'};
    const t = getToken();
    if(t) h['Authorization'] = 'Bearer ' + t;
    return h;
  }

  function from(table){
    const q = {
      _table: table, _order: null, _filters: [], _single: false, _method: 'GET', _body: null,
      select(){ return q; },
      order(col, opts){ q._order = { col, ascending: !opts || opts.ascending !== false }; return q; },
      eq(col, val){ q._filters.push([col, val]); return q; },
      single(){ q._single = true; return q; },
      insert(payload){ q._method = 'POST'; q._body = payload; return q; },
      update(payload){ q._method = 'PATCH'; q._body = payload; return q; },
      delete(){ q._method = 'DELETE'; return q; },
      then(resolve, reject){ q._exec().then(resolve, reject); },
      async _exec(){
        try{
          let url = `${baseUrl}/api/${q._table}`;
          if((q._method === 'PATCH' || q._method === 'DELETE')){
            const idFiltro = q._filters.find(f => f[0] === 'id');
            if(idFiltro) url += `/${idFiltro[1]}`;
          }
          if(q._method === 'GET' && q._order){
            url += `?order=${q._order.col}&dir=${q._order.ascending ? 'asc' : 'desc'}`;
          }
          const opts = { method: q._method, headers: authHeaders() };
          if(q._body) opts.body = JSON.stringify(q._body);

          const res = await fetch(url, opts);
          if(!res.ok){
            const errBody = await res.json().catch(() => ({ message: res.statusText }));
            return { data: null, error: errBody };
          }
          let data = await res.json().catch(() => null);
          if(q._single && Array.isArray(data)) data = data[0] || null;
          return { data, error: null };
        }catch(e){
          return { data: null, error: { message: e.message } };
        }
      }
    };
    return q;
  }

  return {
    from,
    auth: {
      async getSession(){
        const t = getToken();
        if(!t) return { data: { session: null } };
        try{
          const res = await fetch(`${baseUrl}/api/me`, { headers: authHeaders() });
          if(!res.ok){ setToken(null); return { data: { session: null } }; }
          const user = await res.json();
          return { data: { session: { user, empresa: user.empresa } } };
        }catch(e){ return { data: { session: null } }; }
      },
      async signInWithPassword({ email, password }){
        try{
          const res = await fetch(`${baseUrl}/api/login`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if(!res.ok){ const err = await res.json().catch(() => ({message:'Erro'})); return { error: err }; }
          const j = await res.json();
          setToken(j.token);
          return { data: { session: { user: j.user, empresa: j.empresa } }, error: null };
        }catch(e){ return { error: { message: e.message } }; }
      },
      async signOut(){
        try{ await fetch(`${baseUrl}/api/logout`, { method: 'POST', headers: authHeaders() }); }catch(e){}
        setToken(null);
      }
    }
  };
}

let supabaseClient = null;
let supaOk = false;
try{
  if(!API_BASE_URL.includes('SEU-WORKER')){
    supabaseClient = createCustomClient(API_BASE_URL);
    supaOk = true;
  }
}catch(e){ console.error(e); }

async function apiFetch(path, options={}){
  const token = localStorage.getItem('lo_session');
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if(token) headers['Authorization'] = 'Bearer ' + token;
  try{
    const res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
    const data = await res.json().catch(() => null);
    return { ok: res.ok, status: res.status, data };
  }catch(e){
    return { ok: false, status: 0, data: { message: e.message } };
  }
}

let EMPRESA = { nome: 'LocaObra', cnpj: '', telefone: '', email: '', endereco: '', cidade: '', cor_primaria: '#f59e0b', logo: null };
let PAPEL = 'admin';

function escurecer(hexCor, fator){
  const n = parseInt(hexCor.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * fator), g = Math.round(((n >> 8) & 255) * fator), b = Math.round((n & 255) * fator);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function aplicarEmpresa(emp, papel){
  if(emp) EMPRESA = { ...EMPRESA, ...emp };
  if(papel) PAPEL = papel;
  const cor = /^#[0-9a-fA-F]{6}$/.test(EMPRESA.cor_primaria || '') ? EMPRESA.cor_primaria : '#f59e0b';
  document.documentElement.style.setProperty('--amber', cor);
  document.documentElement.style.setProperty('--amber-dark', escurecer(cor, 0.82));
  if(!EMPRESA.endereco) EMPRESA.endereco = EMPRESA.cidade || '';
  document.getElementById('brand-nome').textContent = EMPRESA.nome || 'LocaObra';
  const logo = document.getElementById('brand-logo');
  if(EMPRESA.logo){ logo.src = EMPRESA.logo; logo.classList.remove('hidden'); }
  else { logo.removeAttribute('src'); logo.classList.add('hidden'); }
  document.title = `${EMPRESA.nome || 'LocaObra'} — LocaObra`;
  document.querySelectorAll('.admin-only').forEach(b => b.classList.toggle('hidden', PAPEL !== 'admin'));
}

function toast(msg, ok=true){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeftColor = ok ? 'var(--amber)' : 'var(--red)';
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.style.display='none', 2600);
}

function fmtMoney(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '-'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return 'id-'+Math.random().toString(36).slice(2,10); }
function fmtNumero(loc){
  if(!loc || !loc.numero) return '-';
  const ano = new Date(loc.data_retirada || loc.criado_em || Date.now()).getFullYear();
  return `${String(loc.numero).padStart(4,'0')}/${String(ano).slice(-2)}`;
}
function assinaturaEletronica(){

}

function gerarQRCodeDataURL(texto){
  return new Promise((resolve) => {
    if(typeof QRCode === 'undefined'){ resolve(null); return; }
    QRCode.toDataURL(texto, { margin: 1, width: 200 }, (err, url) => {
      if(err){ console.error('Erro ao gerar QR code', err); resolve(null); return; }
      resolve(url);
    });
  });
}

function linkWhatsappEmpresa(){
  const digitos = (EMPRESA.telefone || '').replace(/\D/g, '');
  const numeroCompleto = digitos.startsWith('55') ? digitos : `55${digitos}`;
  const msg = `Olá! Vim através de um documento da ${EMPRESA.nome}.`;
  return `https://wa.me/${numeroCompleto}?text=${encodeURIComponent(msg)}`;

/* No celular as tabelas viram cartões: cada célula recebe o nome da coluna */
function rotularTabelas(root){
  root.querySelectorAll('table').forEach(t=>{
    const cab = Array.from(t.querySelectorAll('thead th')).map(th=>th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      Array.from(tr.children).forEach((td,i)=>{
        if(!td.hasAttribute('data-label')) td.setAttribute('data-label', cab[i] || '');
      });
    });
  });
}
(function(){
  const c = document.getElementById('content');
  if(c) new MutationObserver(()=>rotularTabelas(c)).observe(c,{childList:true, subtree:true});
})();

async function render(view){
  const el = document.getElementById('content');

  if(view === 'dashboard') renderDashboard(el);

/* ======================================================
   PLANO E PAGAMENTO (Asaas)
   ====================================================== */
const NOME_PLANO = { essencial: 'Essencial', profissional: 'Profissional' };
const NOME_STATUS = { pendente: 'Aguardando pagamento', ativa: 'Ativa', vencida: 'Vencida', cancelada: 'Cancelada', estornada: 'Estornada' };

function avisoPlano(){
  if(!supaOk || !EMPRESA || !EMPRESA.plano) return '';
  const e = EMPRESA, admin = PAPEL === 'admin';
  const botaoPlanos = admin ? `<button class="btn btn-dark btn-sm" onclick="document.querySelector('[data-view=plano]').click()">Ver planos</button>` : '';
  const botaoFatura = e.fatura_url ? `<a class="btn btn-primary btn-sm" href="${esc(e.fatura_url)}" target="_blank" rel="noopener">Pagar fatura</a>` : '';
  if(e.acesso_liberado === false){
    return `<div class="aviso-plano bloqueio" role="alert"><span><b>${esc(e.motivo_bloqueio || 'Acesso bloqueado.')}</b> Seus dados continuam guardados e você ainda pode consultá-los.${admin ? '' : ' Avise o administrador da empresa.'}</span><span class="acoes">${botaoFatura}${botaoPlanos}</span></div>`;
  }
  if(e.plano === 'teste' && e.dias_teste !== null && e.dias_teste <= 10){
    const txt = e.dias_teste === 0 ? 'Seu teste grátis termina hoje.' : `Faltam ${e.dias_teste} dia(s) do seu teste grátis.`;
    const ja = e.assinatura_status === 'pendente' ? ' Sua assinatura já está pronta: a 1ª cobrança vence no fim do teste.' : '';
    return `<div class="aviso-plano alerta"><span>${txt}${ja}</span><span class="acoes">${botaoFatura}${e.assinatura_status === 'pendente' ? '' : botaoPlanos}</span></div>`;
  }
  if(e.assinatura_status === 'vencida' && e.fatura_url){
    return `<div class="aviso-plano alerta"><span>Há uma fatura vencida. Pague para não perder o acesso.</span><span class="acoes">${botaoFatura}</span></div>`;
  }
  return '';
}

async function atualizarPlano(){
  const r = await apiFetch('/api/assinatura');
  if(r.ok){ aplicarEmpresa(r.data); return true; }
  return false;
}

let CICLO_ESCOLHIDO = 'anual', PLANO_ESCOLHIDO = 'essencial';
async function renderPlano(el){
  if(!supaOk){ el.innerHTML = `${configNote()}<div class="empty">Indisponível no modo demonstração.</div>`; return; }
  el.innerHTML = '<div class="empty">Carregando planos…</div>';
  const [rp] = await Promise.all([fetch(`${API_BASE_URL}/api/planos`).then(r => r.json()).catch(() => null), atualizarPlano()]);
  const e = EMPRESA;
  if(!rp || !rp.planos){ el.innerHTML = '<div class="empty">Não foi possível carregar os planos. Tente de novo.</div>'; return; }
  const P = Object.fromEntries(rp.planos.map(p => [p.id, p]));
  if(e.assinatura_plano) PLANO_ESCOLHIDO = e.assinatura_plano;
  if(e.assinatura_ciclo) CICLO_ESCOLHIDO = e.assinatura_ciclo;
  const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  let situacao;
  if(e.plano === 'ativo') situacao = 'Liberada pelo suporte';
  else if(e.plano === 'teste') situacao = e.acesso_liberado ? `Teste grátis (${e.dias_teste} dia(s) restantes)` : 'Teste encerrado';
  else situacao = e.acesso_liberado ? 'Assinante' : 'Bloqueada';
  const status = `
    <div class="panel">
      <h2>Sua situação</h2>
      ${avisoPlano()}
      <div class="status-plano">
        <div>Conta<b>${situacao}</b></div>
        <div>Plano<b>${e.assinatura_plano ? NOME_PLANO[e.assinatura_plano] + ' · ' + (e.assinatura_ciclo === 'anual' ? 'anual' : 'mensal') : '—'}</b></div>
        <div>Assinatura<b>${NOME_STATUS[e.assinatura_status] || '—'}</b></div>
        <div>${e.plano === 'teste' && !e.pago_ate ? 'Teste até' : 'Pago até'}<b>${e.plano === 'teste' && !e.pago_ate ? fmtDate(e.teste_ate) : (e.pago_ate ? fmtDate(e.pago_ate) : '—')}</b></div>
      </div>
      ${e.fundador ? `<div class="teste-aviso" style="margin-top:10px;">Você é <b>cliente fundador</b>: seu preço está travado até <b>${fmtDate(e.preco_travado_ate)}</b>.</div>` : ''}
      <div class="actions-cell" style="margin-top:12px; flex-wrap:wrap;">
        ${e.fatura_url ? `<a class="btn btn-primary" href="${esc(e.fatura_url)}" target="_blank" rel="noopener">Abrir fatura (Pix, boleto ou cartão)</a>` : ''}
        ${e.assinatura_id || e.assinatura_status ? `<button class="btn btn-outline" id="btn-ja-paguei">Já paguei — atualizar</button>` : ''}
        ${e.assinatura_status && e.assinatura_status !== 'cancelada' ? `<button class="btn btn-danger" id="btn-cancelar-ass">Cancelar assinatura</button>` : ''}
      </div>
    </div>`;

  if(e.plano === 'ativo'){
    el.innerHTML = status + `<div class="panel"><div class="empty">Sua conta foi liberada pelo suporte da Foster Tech. Não é preciso assinar.</div></div>`;
    return;
  }

  const card = id => {
    const p = P[id], mensalEq = CICLO_ESCOLHIDO === 'anual' ? p.anual / 12 : p.mensal;
    return `<div class="plano-card ${PLANO_ESCOLHIDO === id ? 'sel' : ''}" data-plano="${id}" tabindex="0" role="radio" aria-checked="${PLANO_ESCOLHIDO === id}">
      ${id === 'profissional' ? '<span class="selo">Mais completo</span>' : ''}
      <h3>${p.nome}</h3>
      <div class="preco">${brl(mensalEq)}<small>/mês</small></div>
      <div style="font-size:12.5px; color:var(--ink-soft);">${CICLO_ESCOLHIDO === 'anual' ? `${brl(p.anual)} cobrados uma vez por ano` : 'cobrado todo mês'}</div>
      <ul>
        <li>Até ${p.usuarios} usuários</li>
        <li>Locações e ferramentas ilimitadas</li>
        <li>Contrato e termos em PDF com sua marca</li>
        ${id === 'profissional' ? '<li>Pix com baixa automática (sua conta Asaas)</li>' : '<li>Pix com QR Code na sua chave</li>'}
      </ul>
    </div>`;
  };

  el.innerHTML = status + `
    <div class="panel">
      <h2>Escolha seu plano</h2>
      ${rp.vagas_fundador > 0 && !e.fundador ? `<div class="teste-aviso">Lançamento: restam <b>${rp.vagas_fundador}</b> vagas de <b>preço de fundador</b> (valor travado por 12 meses).</div>` : ''}
      <div class="ciclo-toggle" role="group" aria-label="Forma de cobrança">
        <button type="button" data-ciclo="mensal" class="${CICLO_ESCOLHIDO === 'mensal' ? 'on' : ''}">Mensal</button>
        <button type="button" data-ciclo="anual" class="${CICLO_ESCOLHIDO === 'anual' ? 'on' : ''}">Anual (economize 20%)</button>
      </div>
      <div class="planos-grid">${card('essencial')}${card('profissional')}</div>
      <form id="form-assinar">
        <div class="row">
          <div class="field"><label for="ass-doc">CNPJ da locadora (ou CPF)</label><input id="ass-doc" inputmode="numeric" required value="${esc(e.cnpj || '')}" placeholder="00.000.000/0000-00"></div>
          <div class="field"><label for="ass-nome">Nome do responsável</label><input id="ass-nome" value="${esc(e.nome || '')}"></div>
        </div>
        <button type="submit" class="btn btn-primary">${e.plano === 'teste' && e.acesso_liberado ? 'Assinar (1ª cobrança só no fim do teste)' : 'Assinar e gerar fatura'}</button>
        <div style="font-size:12.5px; color:var(--ink-soft); margin-top:8px;">Pagamento pelo Asaas: Pix, boleto ou cartão. Sem fidelidade, cancele quando quiser.</div>
      </form>
    </div>`;

  el.querySelectorAll('[data-ciclo]').forEach(b => b.addEventListener('click', () => { CICLO_ESCOLHIDO = b.dataset.ciclo; renderPlano(el); }));
  el.querySelectorAll('.plano-card').forEach(c => {
    const escolher = () => { PLANO_ESCOLHIDO = c.dataset.plano; el.querySelectorAll('.plano-card').forEach(x => { x.classList.toggle('sel', x === c); x.setAttribute('aria-checked', x === c); }); };
    c.addEventListener('click', escolher);
    c.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); escolher(); } });
  });
  const jaPaguei = document.getElementById('btn-ja-paguei');
  if(jaPaguei) jaPaguei.addEventListener('click', async () => { await atualizarPlano(); toast(EMPRESA.assinatura_status === 'ativa' ? 'Pagamento confirmado!' : 'Ainda não recebemos a confirmação. Pix confirma em minutos; boleto em até 2 dias úteis.'); renderPlano(el); });
  const cancelar = document.getElementById('btn-cancelar-ass');
  if(cancelar) cancelar.addEventListener('click', async () => {
    if(!confirm('Cancelar a assinatura? Você continua usando até o fim do período já pago.')) return;
    const r = await apiFetch('/api/assinatura/cancelar', { method: 'POST' });
    if(!r.ok){ toast(r.data?.message || 'Não foi possível cancelar', false); return; }
    aplicarEmpresa(r.data); toast('Assinatura cancelada'); renderPlano(el);
  });
  document.getElementById('form-assinar').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Gerando fatura…';
    const r = await apiFetch('/api/assinatura', { method: 'POST', body: JSON.stringify({
      plano: PLANO_ESCOLHIDO, ciclo: CICLO_ESCOLHIDO, cpf_cnpj: document.getElementById('ass-doc').value, nome: document.getElementById('ass-nome').value }) });
    if(!r.ok){ toast(r.data?.message || 'Não foi possível assinar', false); btn.disabled = false; btn.textContent = 'Assinar'; return; }
    if(r.data.empresa) aplicarEmpresa(r.data.empresa); else await atualizarPlano();
    toast(r.data.reaproveitada ? 'Você já tem uma fatura aberta para este plano.' : 'Assinatura criada! Abra a fatura para pagar.');
    renderPlano(el);
  });
}

   CONFIG NOTE (se supabase não estiver configurado)

function configNote(){
  if(supaOk) return '';
  return `<div class="config-note">⚠ Backend ainda não configurado — edite <span class="mono">API_BASE_URL</span> no topo do arquivo com o endereço do seu Worker. Rodando em modo demonstração (dados não são salvos).</div>`;
}

/* ======================================================
   DASHBOARD
   ====================================================== */
function renderDashboard(el){
  const ativas = DB.locacoes.filter(l=>l.status==='ativa');
  const atrasadas = DB.locacoes.filter(l=> l.status==='ativa' && l.data_devolucao_prevista < todayISO());
  const disponiveis = DB.ferramentas.reduce((s,f)=>s+(f.quantidade_disponivel||0),0);
  const mesAtual = new Date().toISOString().slice(0,7);
  const faturamentoMes = DB.pagamentos.filter(p=> (p.data_pagamento||'').slice(0,7)===mesAtual && p.tipo==='pagamento')
    .reduce((s,p)=>s+Number(p.valor||0),0);

  el.innerHTML = `
    ${configNote()}
    <div class="grid grid-4" style="margin-bottom:20px;">
      <div class="stat"><div class="num mono">${ativas.length}</div><div class="lbl">Locações ativas</div></div>
      <div class="stat warn"><div class="num mono">${atrasadas.length}</div><div class="lbl">Devoluções atrasadas</div></div>
      <div class="stat ok"><div class="num mono">${disponiveis}</div><div class="lbl">Itens disponíveis</div></div>
      <div class="stat"><div class="num mono">${fmtMoney(faturamentoMes)}</div><div class="lbl">Faturamento do mês</div></div>
    </div>
    <div class="panel">
      <h2>Locações em andamento</h2>
      ${ativas.length ? tableLocacoes(ativas) : `<div class="empty"><div class="display">Nenhuma locação ativa</div>Comece criando uma nova locação.</div>`}
    </div>
  `;
}

function tableLocacoes(list){
  return `<table><thead><tr><th>Nº</th><th>Cliente</th><th>Retirada</th><th>Devolução prevista</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(l=>{
      const cliente = DB.clientes.find(c=>c.id===l.cliente_id);
      const atrasada = l.status==='ativa' && l.data_devolucao_prevista < todayISO();
      const badge = atrasada ? '<span class="badge badge-bad">Atrasada</span>' :
        l.status==='devolvida' ? '<span class="badge badge-neutral">Devolvida</span>' :
        l.status==='cancelada' ? '<span class="badge badge-neutral">Cancelada</span>' :
        '<span class="badge badge-ok">Ativa</span>';
      return `<tr>
        <td class="mono">#${fmtNumero(l)}</td>
        <td>${cliente ? cliente.nome : '—'}</td>
        <td>${fmtDate(l.data_retirada)}</td>
        <td>${fmtDate(l.data_devolucao_prevista)}</td>
        <td class="mono">${fmtMoney(l.valor_total)}</td>
        <td>${badge}</td>
        <td><button class="btn btn-outline btn-sm" onclick="verLocacao('${l.id}')">Ver</button></td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}

/* ======================================================
   CLIENTES
   ====================================================== */
function renderClientes(el){
  el.innerHTML = `
    ${configNote()}
    <div class="grid grid-2">
      <div class="panel">
        <h2 id="form-cliente-titulo">Novo cliente</h2>
        <form id="form-cliente">
          <input type="hidden" id="cli-id" value="">
          <div class="field"><label>Tipo</label>
            <select id="cli-tipo"><option value="fisica">Pessoa física</option><option value="juridica">Pessoa jurídica</option></select>
          </div>
          <div class="field"><label>Nome / Razão social</label><input id="cli-nome" required></div>
          <div class="field"><label>CPF / CNPJ</label><input id="cli-doc" required></div>
          <div class="row">
            <div class="field"><label>Telefone</label><input id="cli-tel" placeholder="(11) 99999-9999"></div>
            <div class="field"><label>E-mail</label><input id="cli-email" type="email"></div>
          </div>
          <div class="field"><label>Endereço</label><input id="cli-end"></div>
          <div class="field"><label>Status</label>
            <select id="cli-status"><option value="ativo">Ativo</option><option value="inadimplente">Inadimplente</option><option value="bloqueado">Bloqueado</option></select>
          </div>
          <div class="field"><label>Observações</label><textarea id="cli-obs" rows="2"></textarea></div>
          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="cli-submit-btn">Cadastrar cliente</button>
            <button type="button" class="btn btn-outline hidden" id="cli-cancel-btn" onclick="cancelarEdicaoCliente()">Cancelar edição</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>Clientes cadastrados <span class="tag">${DB.clientes.length}</span></h2>
        <div class="field"><input id="busca-cliente" placeholder="Buscar por nome ou documento..." oninput="filtrarClientes()"></div>
        <div id="lista-clientes">${listaClientesHTML(DB.clientes)}</div>
      </div>
    </div>
  `;
  document.getElementById('form-cliente').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id = document.getElementById('cli-id').value;
    const dados = {
      tipo_pessoa: document.getElementById('cli-tipo').value,
      nome: document.getElementById('cli-nome').value,
      documento: document.getElementById('cli-doc').value,
      telefone: document.getElementById('cli-tel').value,
      email: document.getElementById('cli-email').value,
      endereco: document.getElementById('cli-end').value,
      observacoes: document.getElementById('cli-obs').value,
      status: document.getElementById('cli-status').value
    };
    if(id){
      if(supaOk){
        const {error} = await supabaseClient.from('clientes').update(dados).eq('id', id);
        if(error){ toast('Erro ao atualizar cliente', false); console.error(error); return; }
      } else {
        const c = DB.clientes.find(x=>x.id===id);
        Object.assign(c, dados);
      }
      toast('Cliente atualizado');
    } else {
      if(supaOk){
        const {error} = await supabaseClient.from('clientes').insert(dados);
        if(error){ toast('Erro ao salvar cliente', false); console.error(error); return; }
      } else {
        dados.id = uid(); dados.criado_em = new Date().toISOString();
        DB.clientes.unshift(dados);
      }
      toast('Cliente cadastrado com sucesso');
    }
    render('clientes');
  });
}

function listaClientesHTML(list){
  if(!list.length) return `<div class="empty"><div class="display">Nenhum cliente encontrado</div></div>`;
  return `<table><thead><tr><th>Nome</th><th>Documento</th><th>Telefone</th><th>Status</th><th>Ações</th></tr></thead><tbody>
    ${list.map(c=>`<tr><td>${c.nome}</td><td class="mono">${c.documento}</td><td>${c.telefone||'-'}</td>
    <td><span class="badge ${c.status==='ativo'?'badge-ok':'badge-bad'}">${c.status}</span></td>
    <td class="actions-cell">
      <button class="btn btn-outline btn-sm" onclick="editarCliente('${c.id}')">Editar</button>
      <button class="btn btn-danger btn-sm" onclick="excluirCliente('${c.id}')">Excluir</button>
    </td></tr>`).join('')}
    </tbody></table>`;
}

function filtrarClientes(){
  const termo = document.getElementById('busca-cliente').value.toLowerCase();
  const filtrados = DB.clientes.filter(c => c.nome.toLowerCase().includes(termo) || (c.documento||'').toLowerCase().includes(termo));
  document.getElementById('lista-clientes').innerHTML = listaClientesHTML(filtrados);
}

function editarCliente(id){
  const c = DB.clientes.find(x=>x.id===id);
  if(!c) return;
  document.getElementById('cli-id').value = c.id;
  document.getElementById('cli-tipo').value = c.tipo_pessoa || 'fisica';
  document.getElementById('cli-nome').value = c.nome || '';
  document.getElementById('cli-doc').value = c.documento || '';
  document.getElementById('cli-tel').value = c.telefone || '';
  document.getElementById('cli-email').value = c.email || '';
  document.getElementById('cli-end').value = c.endereco || '';
  document.getElementById('cli-status').value = c.status || 'ativo';
  document.getElementById('cli-obs').value = c.observacoes || '';
  document.getElementById('form-cliente-titulo').textContent = 'Editar cliente';
  document.getElementById('cli-submit-btn').textContent = 'Salvar alterações';
  document.getElementById('cli-cancel-btn').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelarEdicaoCliente(){ render('clientes'); }

async function excluirCliente(id){
  if(!confirm('Excluir este cliente? Essa ação não pode ser desfeita.')) return;
  if(supaOk){
    const {error} = await supabaseClient.from('clientes').delete().eq('id', id);
    if(error){ toast('Não foi possível excluir (talvez tenha locações vinculadas)', false); console.error(error); return; }
  } else {
    DB.clientes = DB.clientes.filter(x=>x.id!==id);
  }
  toast('Cliente excluído');
  render('clientes');
}

const ILU_REGRAS = [
  [/plataforma|tesoura|pta\b/, 'plataforma'], [/talha|guincho/, 'talha'], [/sapata|base regul/, 'sapata'],
  [/diagonal|contravent/, 'diagonal'], [/rodap|prancha|piso de andaime/, 'prancha'], [/escada/, 'escada'],
  [/guarda.?corpo/, 'guardacorpo'], [/sarrafo|madeira/, 'sarrafo'], [/cinto|talabarte|trava.?queda/, 'cinto'],
  [/escora/, 'escora'], [/forma|fôrma/, 'forma'], [/andaime|rodizio|rodízio/, 'andaime'],
  [/parafusadeira/, 'parafusadeira'], [/furadeira|perfurador/, 'furadeira'], [/esmerilh|lixadeira angular|policorte/, 'esmerilhadeira'],
  [/martelete|rompedor/, 'martelete'], [/betoneira/, 'betoneira'], [/vibrador/, 'vibrador'], [/regua vibrat|régua vibrat|placa vibrat/, 'placa'],
  [/alisadora|bambol/, 'alisadora'], [/rolo compact/, 'rolo'], [/compactador|soquete|sapo/, 'compactador'],
  [/gerador/, 'gerador'], [/carrinho|girica/, 'carrinho'], [/cortadora|corte de piso/, 'corte_piso'], [/serra/, 'serra'],
  [/lixadeira|girafa/, 'esmerilhadeira'], [/compressor/, 'compressor'], [/lavadora|alta press|wap/, 'lavadora'],
  [/aspirador/, 'aspirador'], [/bomba/, 'bomba'], [/solda/, 'solda'], [/laser|nível|nivel/, 'laser'],
  [/refletor|ilumina/, 'refletor'], [/extens|cabo/, 'extensao'], [/caçamba|cacamba|container|entulho/, 'cacamba']
];
function iluChave(nome){
  const n = String(nome || '').toLowerCase();
  for(const [re, k] of ILU_REGRAS) if(re.test(n)) return k;
  return 'generico';
}
function ilustracao(nome, tam = 40, rotulo = ''){
  return `<svg class="ilu" viewBox="0 0 64 64" width="${tam}" height="${tam}" role="img" aria-label="${String(rotulo || 'Ilustração').replace(/["<>&]/g, '')}" focusable="false">${ILU[iluChave(nome)]}</svg>`;
}

// Próximo código livre no padrão FER-001, olhando o maior número já usado
function proximoCodigo(deslocamento = 0){
  const nums = DB.ferramentas.map(f => (String(f.codigo || '').match(/^FER-(\d+)$/i) || [])[1]).filter(Boolean).map(Number);
  const prox = (nums.length ? Math.max(...nums) : 0) + 1 + deslocamento;
  return `FER-${String(prox).padStart(3, '0')}`;
}
// Ao escolher um nome da lista, preenche categoria e diária se estiverem vazias
function sugerirPorNome(){
  const nome = document.getElementById('fer-nome').value.trim().toLowerCase();
  const item = CATALOGO_FERRAMENTAS.find(f => f.nome.toLowerCase() === nome);
  if(!item) return;
  const cat = document.getElementById('fer-cat'), dia = document.getElementById('fer-diaria');
  if(!cat.value) cat.value = item.categoria;
  if(!dia.value) dia.value = item.valor_diaria;
}

async function cadastrarComuns(){
  const marcados = Array.from(document.querySelectorAll('.chk-comum:checked')).map(el=>Number(el.dataset.idx));
  if(!marcados.length){ toast('Selecione ao menos uma ferramenta', false); return; }
  const novos = marcados.map((idx, n)=>{
    const f = FERRAMENTAS_COMUNS[idx];
    const codigo = proximoCodigo(n);
    return {
      codigo, nome: f.nome, categoria: f.categoria,
      valor_diaria: f.valor_diaria, valor_semanal: null, valor_mensal: null, valor_reposicao: null,
      quantidade_total: 1, quantidade_disponivel: 1, status: 'disponivel'
    };
  });
  if(supaOk){
    const {error} = await supabaseClient.from('ferramentas').insert(novos);
    if(error){ toast('Erro ao cadastrar em lote', false); console.error(error); return; }
  } else {
    novos.forEach(n=>{ n.id = uid(); n.criado_em = new Date().toISOString(); DB.ferramentas.unshift(n); });
  }
  toast(`${novos.length} ferramenta(s) cadastrada(s)`);
  render('ferramentas');
}

          </div>
          <div class="row">
            <div class="field"><label>Valor de reposição (R$)</label><input id="fer-reposicao" type="number" step="0.01"></div>
            <div class="field"><label>Quantidade em estoque</label><input id="fer-qtd" type="number" value="1" min="1" required></div>
          </div>
          <div class="field"><label>Status</label>
            <select id="fer-status"><option value="disponivel">Disponível</option><option value="manutencao">Em manutenção</option><option value="inativo">Inativo</option></select>
          </div>
          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="fer-submit-btn">Cadastrar ferramenta</button>
            <button type="button" class="btn btn-outline hidden" id="fer-cancel-btn" onclick="cancelarEdicaoFerramenta()">Cancelar edição</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>Estoque <span class="tag">${DB.ferramentas.length}</span></h2>
        <div class="field"><input id="busca-ferramenta" placeholder="Buscar por nome ou código..." oninput="filtrarFerramentas()"></div>
        <div id="lista-ferramentas">${listaFerramentasHTML(DB.ferramentas)}</div>
      </div>
    </div>
  `;
  document.getElementById('form-ferramenta').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id = document.getElementById('fer-id').value;
    const qtd = Number(document.getElementById('fer-qtd').value);
    const codigoDigitado = document.getElementById('fer-cod').value.trim().toUpperCase();
    const repetido = DB.ferramentas.find(f => f.id !== id && String(f.codigo || '').trim().toUpperCase() === codigoDigitado);
    if(repetido){ toast(`O código ${codigoDigitado} já é usado em "${repetido.nome}". Use ${proximoCodigo()}.`, false); return; }
    const dados = {
      codigo: codigoDigitado,
      categoria: document.getElementById('fer-cat').value,
      nome: document.getElementById('fer-nome').value,
      valor_diaria: Number(document.getElementById('fer-diaria').value),
      valor_semanal: document.getElementById('fer-semanal').value ? Number(document.getElementById('fer-semanal').value) : null,
      valor_mensal: document.getElementById('fer-mensal').value ? Number(document.getElementById('fer-mensal').value) : null,
      valor_reposicao: document.getElementById('fer-reposicao').value ? Number(document.getElementById('fer-reposicao').value) : null,
      status: document.getElementById('fer-status').value
    };
    if(id){
      const atual = DB.ferramentas.find(x=>x.id===id);
      const delta = qtd - atual.quantidade_total;
      dados.quantidade_total = qtd;
      dados.quantidade_disponivel = Math.max(0, atual.quantidade_disponivel + delta);
      if(supaOk){
        const {error} = await supabaseClient.from('ferramentas').update(dados).eq('id', id);
        if(error){ toast('Erro ao atualizar ferramenta', false); console.error(error); return; }
      } else {
        Object.assign(atual, dados);
      }
      toast('Ferramenta atualizada');
    } else {
      dados.quantidade_total = qtd;
      dados.quantidade_disponivel = qtd;
      if(supaOk){
        const {error} = await supabaseClient.from('ferramentas').insert(dados);
        if(error){ toast('Erro ao salvar ferramenta', false); console.error(error); return; }
      } else {
        dados.id = uid(); dados.criado_em = new Date().toISOString();
        DB.ferramentas.unshift(dados);
      }
      toast('Ferramenta cadastrada com sucesso');
    }
    render('ferramentas');
  });
}

function listaFerramentasHTML(list){
  if(!list.length) return `<div class="empty"><div class="display">Nenhuma ferramenta encontrada</div></div>`;
  return `<table><thead><tr><th>Código</th><th>Nome</th><th>Diária</th><th>Disponível</th><th>Status</th><th>Ações</th></tr></thead><tbody>
    ${list.map(f=>`<tr><td class="mono">${f.codigo}</td><td><span class="fer-nome">${ilustracao(f.nome, 30, f.nome)}<span>${esc(f.nome)}</span></span></td><td class="mono">${fmtMoney(f.valor_diaria)}</td>
    <td class="mono">${f.quantidade_disponivel}/${f.quantidade_total}</td>
    <td><span class="badge ${f.status==='disponivel'?'badge-ok':f.status==='manutencao'?'badge-warn':'badge-neutral'}">${f.status}</span></td>
    <td class="actions-cell">
      <button class="btn btn-outline btn-sm" onclick="editarFerramenta('${f.id}')">Editar</button>
      <button class="btn btn-danger btn-sm" onclick="excluirFerramenta('${f.id}')">Excluir</button>
    </td></tr>`).join('')}
    </tbody></table>`;
}

function filtrarFerramentas(){
  const termo = document.getElementById('busca-ferramenta').value.toLowerCase();
  const filtrados = DB.ferramentas.filter(f => f.nome.toLowerCase().includes(termo) || (f.codigo||'').toLowerCase().includes(termo));
  document.getElementById('lista-ferramentas').innerHTML = listaFerramentasHTML(filtrados);
}

function editarFerramenta(id){
  const f = DB.ferramentas.find(x=>x.id===id);
  if(!f) return;
  document.getElementById('fer-id').value = f.id;
  document.getElementById('fer-cod').value = f.codigo || '';
  document.getElementById('fer-cat').value = f.categoria || '';
  document.getElementById('fer-nome').value = f.nome || '';
  document.getElementById('fer-diaria').value = f.valor_diaria || '';
  document.getElementById('fer-semanal').value = f.valor_semanal || '';
  document.getElementById('fer-mensal').value = f.valor_mensal || '';
  document.getElementById('fer-reposicao').value = f.valor_reposicao || '';
  document.getElementById('fer-qtd').value = f.quantidade_total || 1;
  document.getElementById('fer-status').value = f.status || 'disponivel';
  document.getElementById('form-ferramenta-titulo').textContent = 'Editar ferramenta';
  document.getElementById('fer-submit-btn').textContent = 'Salvar alterações';
  document.getElementById('fer-cancel-btn').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelarEdicaoFerramenta(){ render('ferramentas'); }

async function excluirFerramenta(id){
  if(!confirm('Excluir esta ferramenta? Essa ação não pode ser desfeita.')) return;
  if(supaOk){
    const {error} = await supabaseClient.from('ferramentas').delete().eq('id', id);
    if(error){ toast('Não foi possível excluir (talvez tenha locações vinculadas)', false); console.error(error); return; }
  } else {
    DB.ferramentas = DB.ferramentas.filter(x=>x.id!==id);
  }
  toast('Ferramenta excluída');
  render('ferramentas');
}

function adicionarItem(){
  const sel = document.getElementById('add-ferramenta');
  const qtd = Number(document.getElementById('add-qtd').value);
  if(!sel.value){ toast('Selecione uma ferramenta', false); return; }
  const existente = carrinho.find(i=>i.ferramenta_id===sel.value);
  if(existente){ existente.quantidade += qtd; }
  else { carrinho.push({ferramenta_id: sel.value, quantidade: qtd}); }
  renderCarrinho();
  calcularResumo();
}

function removerItem(fid){
  carrinho = carrinho.filter(i=>i.ferramenta_id!==fid);
  renderCarrinho();
  calcularResumo();
}

function renderCarrinho(){
  const box = document.getElementById('carrinho-list');
  if(!carrinho.length){ box.innerHTML = '<div class="empty" style="padding:16px;">Nenhuma ferramenta adicionada ainda</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>Ferramenta</th><th>Qtd</th><th></th></tr></thead><tbody>
    ${carrinho.map(i=>{
      const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
      return `<tr><td>${f?f.nome:'?'}</td><td class="mono">${i.quantidade}</td>
      <td><button class="btn btn-danger btn-sm" onclick="removerItem('${i.ferramenta_id}')">Remover</button></td></tr>`;
    }).join('')}
  </tbody></table>`;
}

function calcularPeriodo(){
  const r = document.getElementById('loc-retirada').value;
  const d = document.getElementById('loc-devolucao').value;
  if(!r || !d) return {dias:0};
  const dias = Math.max(1, Math.round((new Date(d) - new Date(r)) / 86400000));
  return {dias};
}

function calcularItemValor(f, tipo, dias){
  if(!f) return 0;
  if(tipo==='diaria') return f.valor_diaria * dias;
  if(tipo==='semanal'){
    const semanas = Math.ceil(dias/7);
    const vSemana = f.valor_semanal || (f.valor_diaria*5);
    return vSemana * semanas;
  }
  if(tipo==='mensal'){
    const meses = Math.ceil(dias/30);
    const vMes = f.valor_mensal || (f.valor_diaria*22);
    return vMes * meses;
  }
  return 0;
}

function calcularResumo(){
  const box = document.getElementById('resumo');
  if(!box) return;
  const tipo = document.getElementById('loc-tipo').value;
  const {dias} = calcularPeriodo();
  const caucao = Number(document.getElementById('loc-caucao').value || 0);

  let total = 0;
  const linhas = carrinho.map(i=>{
    const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
    const subtotal = calcularItemValor(f, tipo, dias) * i.quantidade;
    total += subtotal;
    return `<div class="row" style="font-size:13.5px; color:#C9CCD1;"><span>${f?f.nome:'?'} × ${i.quantidade}</span><span class="mono">${fmtMoney(subtotal)}</span></div>`;
  }).join('');

  box.innerHTML = `
    <div class="summary-box">
      <div style="font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; color:#9CA0A8; margin-bottom:8px;">
        Período: ${dias} dia(s) · Cobrança ${tipo}
      </div>
      ${linhas || '<div style="color:#9CA0A8; font-size:13.5px;">Adicione ferramentas acima</div>'}
      <div class="row" style="margin-top:10px; border-top:1px solid #3A3D42; padding-top:10px;">
        <span>Caução</span><span class="mono">${fmtMoney(caucao)}</span>
      </div>
      <div class="row" style="margin-top:6px;">
        <span style="font-family:'Oswald',sans-serif; text-transform:uppercase;">Total da locação</span>
        <span class="total">${fmtMoney(total)}</span>
      </div>
    </div>
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button class="btn btn-primary" onclick="salvarLocacao()">Confirmar locação</button>
    </div>
  `;
  window._locTotal = total;
}

async function salvarLocacao(){
  const clienteId = document.getElementById('loc-cliente').value;
  if(!clienteId){ toast('Selecione um cliente', false); return; }
  if(!carrinho.length){ toast('Adicione ao menos uma ferramenta', false); return; }

  const tipo = document.getElementById('loc-tipo').value;
  const retirada = document.getElementById('loc-retirada').value;
  const devolucao = document.getElementById('loc-devolucao').value;
  const caucao = Number(document.getElementById('loc-caucao').value || 0);
  const {dias} = calcularPeriodo();

  const locacaoObj = {
    cliente_id: clienteId,
    data_retirada: retirada,
    data_devolucao_prevista: devolucao,
    tipo_cobranca: tipo,
    valor_total: window._locTotal || 0,
    valor_caucao: caucao,
    status: 'ativa'
  };

  let locacaoId, numero;
  if(supaOk){
    const {data, error} = await supabaseClient.from('locacoes').insert(locacaoObj).select().single();
    if(error){ toast('Erro ao salvar locação', false); console.error(error); return; }
    locacaoId = data.id; numero = data.numero;
    const itens = carrinho.map(i=>{
      const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
      const valorUnit = calcularItemValor(f, tipo, dias);
      return {locacao_id: locacaoId, ferramenta_id: i.ferramenta_id, quantidade: i.quantidade, valor_unitario: valorUnit, subtotal: valorUnit*i.quantidade};
    });
    // o servidor grava cada item e baixa o estoque junto; recusa se faltar quantidade
    const {error:e2} = await supabaseClient.from('itens_locacao').insert(itens);
    if(e2){
      console.error(e2);
      toast((e2.message || 'Erro ao gravar itens') + ' — confira o estoque e a locação nº ' + numero, false);
    }
    if(caucao > 0){
      await supabaseClient.from('pagamentos').insert({locacao_id: locacaoId, tipo:'caucao', valor: caucao, forma_pagamento:'a definir'});
    }
  } else {
    locacaoId = uid(); numero = DB.locacoes.length + 1;
    locacaoObj.id = locacaoId; locacaoObj.numero = numero; locacaoObj.criado_em = new Date().toISOString();
    DB.locacoes.unshift(locacaoObj);
    carrinho.forEach(i=>{
      const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
      const valorUnit = calcularItemValor(f, tipo, dias);
      DB.itens_locacao.push({id:uid(), locacao_id: locacaoId, ferramenta_id:i.ferramenta_id, quantidade:i.quantidade, valor_unitario:valorUnit, subtotal:valorUnit*i.quantidade});
      f.quantidade_disponivel -= i.quantidade;
    });
  }

  toast('Locação registrada! Gerando contrato...');
  await loadAll();
  const locFinal = supaOk ? DB.locacoes.find(l=>l.id===locacaoId) : locacaoObj;
  gerarContratoPDF(locFinal);
  document.querySelector('[data-view="locacoes"]').click();
}

function filtrarLocacoes(){
  const termo = document.getElementById('busca-locacao').value.toLowerCase();
  const statusFiltro = document.getElementById('filtro-status-locacao').value;
  const filtrados = DB.locacoes.filter(l=>{
    const cliente = DB.clientes.find(c=>c.id===l.cliente_id);
    const nomeMatch = (cliente?.nome||'').toLowerCase().includes(termo) || String(l.numero||'').includes(termo);
    const atrasada = l.status==='ativa' && l.data_devolucao_prevista < todayISO();
    const statusReal = atrasada ? 'atrasada' : l.status;
    const statusMatch = !statusFiltro || statusReal === statusFiltro;
    return nomeMatch && statusMatch;
  });
  document.getElementById('lista-locacoes').innerHTML = filtrados.length ? tableLocacoesCompleta(filtrados) : `<div class="empty"><div class="display">Nenhuma locação encontrada</div></div>`;
}

function calcularMulta(locacaoId, diasAtraso){
  if(diasAtraso <= 0) return 0;
  const itens = DB.itens_locacao.filter(i=>i.locacao_id===locacaoId);
  let multaDia = 0;
  itens.forEach(i=>{
    const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
    if(f) multaDia += (f.valor_diaria || 0) * i.quantidade;
  });
  return multaDia * diasAtraso;
}

async function marcarDevolvida(id){
  const hoje = todayISO();
  const loc = DB.locacoes.find(x=>x.id===id);
  const diasAtraso = loc ? Math.max(0, Math.round((new Date(hoje) - new Date(loc.data_devolucao_prevista)) / 86400000)) : 0;
  const multa = calcularMulta(id, diasAtraso);

  if(supaOk){
    // status, estoque e multa são atualizados juntos pelo servidor
    const resp = await apiFetch(`/api/locacoes/${id}/devolver`, { method: 'POST', body: JSON.stringify({ data_devolucao: hoje }) });
    if(!resp.ok){ toast(resp.data?.message || 'Erro ao registrar devolução', false); return; }
  } else {
    loc.status='devolvida'; loc.data_devolucao_real=hoje; loc.valor_multa=multa;
    DB.itens_locacao.filter(i=>i.locacao_id===id).forEach(i=>{
      const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
      if(f) f.quantidade_disponivel += i.quantidade;
    });
  }
  toast(multa > 0 ? `Devolução registrada com multa de ${fmtMoney(multa)} (${diasAtraso} dia(s) de atraso)` : 'Devolução registrada, estoque atualizado');
  render('locacoes');
}

function lembreteWhatsapp(id){
  const loc = DB.locacoes.find(x=>x.id===id);
  const cliente = DB.clientes.find(c=>c.id===loc.cliente_id);
  if(!cliente || !cliente.telefone){ toast('Cliente sem telefone cadastrado', false); return; }
  const itens = DB.itens_locacao.filter(i=>i.locacao_id===id);
  const nomesFerramentas = itens.map(i=>{
    const f = DB.ferramentas.find(x=>x.id===i.ferramenta_id);
    return f ? f.nome : '';
  }).filter(Boolean).join(', ');
  const atrasada = loc.data_devolucao_prevista < todayISO();
  const msg = atrasada
    ? `Olá, ${cliente.nome}! A devolução de ${nomesFerramentas} estava prevista para ${fmtDate(loc.data_devolucao_prevista)} e consta em atraso. Poderia nos dar um retorno sobre a devolução? — ${EMPRESA.nome}`
    : `Olá, ${cliente.nome}! Passando para lembrar que a devolução de ${nomesFerramentas} está prevista para ${fmtDate(loc.data_devolucao_prevista)}. Qualquer dúvida, estamos à disposição. — ${EMPRESA.nome}`;
  const digitos = (cliente.telefone || '').replace(/\D/g, '');
  const numeroCompleto = digitos.startsWith('55') ? digitos : `55${digitos}`;
  window.open(`https://wa.me/${numeroCompleto}?text=${encodeURIComponent(msg)}`, '_blank');
}

function ligarPainelPix(e){
  const mostrar = () => {
    const v = (document.querySelector('input[name=pix-modo]:checked') || {}).value || '';
    document.getElementById('pix-box-simples').classList.toggle('hidden', v !== 'simples');
    document.getElementById('pix-box-asaas').classList.toggle('hidden', v !== 'asaas');
    const off = document.getElementById('pix-box-off');
    off.classList.toggle('hidden', v !== '');
    if(v === '' && e.pix_modo) off.innerHTML = '<button type="button" class="btn btn-danger" id="pix-desativar">Desativar recebimento por Pix</button>';
    const d = document.getElementById('pix-desativar');
    if(d) d.onclick = () => salvarPix({ modo: null }, 'Pix desativado');
  };
  document.querySelectorAll('input[name=pix-modo]').forEach(r => r.addEventListener('change', mostrar));
  const s = document.getElementById('pix-salvar-simples');
  if(s) s.onclick = () => salvarPix({ modo: 'simples', tipo: document.getElementById('pix-tipo').value, chave: document.getElementById('pix-chave').value,
    nome: document.getElementById('pix-nome').value, cidade: document.getElementById('pix-cidade').value }, 'Pix simples configurado');
  const a = document.getElementById('pix-salvar-asaas');
  if(a) a.onclick = () => {
    const k = document.getElementById('pix-api').value.trim();
    if(!k){ toast('Cole a chave de API do Asaas', false); return; }
    salvarPix({ modo: 'asaas', api_key: k }, 'Asaas conectado');
  };
}
async function salvarPix(corpo, msg){
  const btns = document.querySelectorAll('#pix-salvar-simples, #pix-salvar-asaas, #pix-desativar');
  btns.forEach(b => b.disabled = true);
  const resp = await apiFetch('/api/pix/config', { method: 'POST', body: JSON.stringify(corpo) });
  btns.forEach(b => b.disabled = false);
  if(!resp.ok){ toast(resp.data?.message || 'Erro ao salvar o Pix', false); return; }
  aplicarEmpresa(resp.data);
  toast(resp.data.webhook_criado === false ? 'Asaas conectado. Aviso automático não foi criado: o sistema vai conferir os pagamentos ao abrir a cobrança.' : msg);
  render('empresa');
}

/* ======================================================
   COBRAR POR PIX (uma locação)
   ====================================================== */
let PIX_TIMER = null;
// datas do servidor vêm em UTC; mostra no horário de Brasília
function dataBR(utc){ const d = new Date(String(utc || '').replace(' ', 'T') + (String(utc).includes('Z') ? '' : 'Z')); return isNaN(d) ? String(utc || '').slice(0, 10) : new Date(d.getTime() - 3 * 3600000).toISOString().slice(0, 10); }
function saldoLocacao(loc){
  const pago = DB.pagamentos.filter(p => p.locacao_id === loc.id && p.tipo === 'pagamento').reduce((t, p) => t + Number(p.valor || 0), 0);
  return Math.max(0, Math.round((Number(loc.valor_total || 0) + Number(loc.valor_multa || 0) - pago) * 100) / 100);
}
function fecharPix(){
  clearInterval(PIX_TIMER); PIX_TIMER = null;
  const f = document.getElementById('pix-fundo'); if(f) f.remove();
  document.removeEventListener('keydown', escPix);
}
function escPix(ev){ if(ev.key === 'Escape') fecharPix(); }
async function abrirPix(locId){
  fecharPix();
  const loc = DB.locacoes.find(l => l.id === locId); if(!loc) return;
  const cli = DB.clientes.find(c => c.id === loc.cliente_id);
  const fundo = document.createElement('div');
  fundo.id = 'pix-fundo'; fundo.className = 'pix-fundo';
  fundo.innerHTML = `<div class="pix-caixa" role="dialog" aria-modal="true" aria-labelledby="pix-tit">
    <div class="pix-topo"><div><h2 id="pix-tit">Cobrar por Pix</h2><div style="font-size:13px; color:var(--ink-soft);">Locação #${fmtNumero(loc)} · ${esc(cli ? cli.nome : '')}</div></div>
    <button class="pix-fechar" aria-label="Fechar" onclick="fecharPix()">×</button></div>
    <div id="pix-corpo"><div class="empty">Carregando…</div></div></div>`;
  fundo.addEventListener('click', ev => { if(ev.target === fundo) fecharPix(); });
  document.body.appendChild(fundo);
  document.addEventListener('keydown', escPix);
  await atualizarPix(loc, cli);
}
async function atualizarPix(loc, cli, focoId){
  const corpo = document.getElementById('pix-corpo'); if(!corpo) return;
  const e = EMPRESA;
  if(!e.pix_modo){
    corpo.innerHTML = `<div class="empty" style="padding:14px 0;">O recebimento por Pix ainda não foi configurado.</div>
      ${PAPEL === 'admin' ? `<button class="btn btn-primary" style="width:100%" onclick="fecharPix(); document.querySelector('[data-view=empresa]').click()">Configurar em Minha empresa</button>` : '<div style="font-size:13px; text-align:center;">Peça ao administrador para configurar em Minha empresa.</div>'}`;
    return;
  }
  const r = await apiFetch(`/api/locacoes/${loc.id}/pix`);
  if(!document.getElementById('pix-corpo')) return;
  const lista = r.ok ? r.data : [];
  const pend = lista.find(c => c.status === 'pendente' && (!focoId || c.id === focoId)) || lista.find(c => c.status === 'pendente');
  const hist = lista.filter(c => c !== pend);
  const histHtml = hist.length ? `<div class="pix-hist"><b>Histórico</b>${hist.map(c => `<div><span>${fmtDate(dataBR(c.criado_em))}${c.descricao ? ' · ' + esc(c.descricao) : ''}</span><span class="mono">${fmtMoney(c.valor)} <span class="badge ${c.status === 'paga' ? 'badge-ok' : c.status === 'cancelada' ? 'badge-neutral' : 'badge-warn'}">${c.status}</span></span></div>`).join('')}</div>` : '';
  if(pend){
    let qr = '';
    try{ qr = await gerarQRCodeDataURL(pend.payload); }catch(err){}
    corpo.innerHTML = `
      <div class="pix-valor">${fmtMoney(pend.valor)}</div>
      ${pend.descricao ? `<div style="text-align:center; font-size:13px; color:var(--ink-soft);">${esc(pend.descricao)}</div>` : ''}
      ${qr ? `<img class="pix-qr" src="${qr}" alt="QR Code Pix">` : ''}
      <label for="pix-copia" style="font-size:12px;">Pix copia e cola</label>
      <textarea id="pix-copia" class="pix-copia" readonly>${esc(pend.payload)}</textarea>
      <div class="actions-cell" style="margin-top:8px;">
        <button class="btn btn-outline btn-sm" onclick="copiarPix()">Copiar código</button>
        <button class="btn btn-outline btn-sm" onclick="enviarPixWhatsapp('${loc.id}', '${pend.id}')">Enviar no WhatsApp</button>
        ${pend.fatura_url ? `<a class="btn btn-outline btn-sm" href="${esc(pend.fatura_url)}" target="_blank" rel="noopener">Abrir fatura</a>` : ''}
      </div>
      <div style="margin-top:12px; font-size:13px; padding:10px; border-radius:6px; background:#F7F5F0;">
        ${pend.modo === 'asaas' ? '⏳ Aguardando pagamento. Quando o cliente pagar, a baixa entra sozinha.' : 'Quando o dinheiro cair na sua conta, confirme abaixo para registrar o pagamento.'}
      </div>
      <div class="actions-cell" style="margin-top:10px;">
        ${pend.modo === 'simples' ? `<button class="btn btn-primary" onclick="acaoPix('${loc.id}', '${pend.id}', 'pago')">Confirmar recebimento</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="acaoPix('${loc.id}', '${pend.id}', 'cancelar')">Cancelar cobrança</button>
      </div>
      ${histHtml}`;
    window.__PIX_ATUAL = { loc, cli, pend };
    clearInterval(PIX_TIMER);
    if(pend.modo === 'asaas') PIX_TIMER = setInterval(async () => {
      const rr = await apiFetch(`/api/locacoes/${loc.id}/pix`);
      const c = rr.ok && rr.data.find(x => x.id === pend.id);
      if(c && c.status === 'paga'){ clearInterval(PIX_TIMER); toast(`Pix de ${fmtMoney(c.valor)} recebido!`); await loadAll(); atualizarPix(loc, cli); }
    }, 6000);
    return;
  }
  clearInterval(PIX_TIMER);
  const saldo = saldoLocacao(loc);
  corpo.innerHTML = `
    <form id="form-pix">
      <div class="field"><label for="pix-valor">Valor a cobrar (R$)</label><input id="pix-valor" type="number" step="0.01" min="1" required value="${saldo >= 1 ? saldo.toFixed(2) : ''}"></div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:-6px 0 10px;">Em aberto nesta locação: <b>${fmtMoney(saldo)}</b></div>
      <div class="field"><label for="pix-desc">Descrição (opcional)</label><input id="pix-desc" maxlength="80" list="pix-sugestoes" placeholder="Ex.: Sinal, Saldo, Multa por atraso">

      <button type="submit" class="btn btn-primary" style="width:100%">Gerar Pix</button>

// Reduz o logo no navegador para caber no limite do servidor
function reduzirImagem(arquivo, maxL, maxA){
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onerror = reject;
    leitor.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const escala = Math.min(1, maxL / img.width, maxA / img.height);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        const ctx = c.getContext('2d');
        const png = arquivo.type === 'image/png';
        if(!png){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.85));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

/* ======================================================
   PAPEL TIMBRADO — cabeçalho e rodapé padrão de todos os PDFs
   ====================================================== */
function desenharCabecalhoPDF(doc, titulo, subtitulo){
  // faixa preta no topo (fundo da marca)
  doc.setFillColor(20, 20, 20);
  doc.rect(0, 0, 210, 20, 'F');

  // logo real embutido no app
  try{
    if(EMPRESA.logo && /^data:image\/(png|jpeg)/.test(EMPRESA.logo)){
      const fmt = EMPRESA.logo.startsWith('data:image/png') ? 'PNG' : 'JPEG';
      doc.addImage(EMPRESA.logo, fmt, 8, 3, 26, 14);
    }
  }catch(e){ console.error('logo pdf', e); }

  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.setTextColor(255,255,255);
  doc.text(EMPRESA.nome, 195, 8, {align:'right'});
  doc.text(`${EMPRESA.telefone}  ·  ${EMPRESA.email}`, 195, 13, {align:'right'});

  // linha tricolor (assinatura visual da marca)
  doc.setFillColor(76,154,28); doc.rect(0, 20, 70, 1.6, 'F');
  doc.setFillColor(219,27,22); doc.rect(70, 20, 70, 1.6, 'F');
  doc.setFillColor(29,63,115); doc.rect(140, 20, 70, 1.6, 'F');

  doc.setTextColor(0,0,0);
  let y = 30;
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(titulo, 105, y, {align:'center'}); y+=6;
  if(subtitulo){
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(subtitulo, 105, y, {align:'center'}); y+=8;
  } else {
    y+=4;
  }
  return y;
}

function desenharRodapePDF(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1; i<=pageCount; i++){
    doc.setPage(i);
    doc.setDrawColor(220,220,220); doc.setLineWidth(0.2);
    doc.line(15, 282, 195, 282);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor(140,140,140);
    doc.text('Gerado pelo LocaObra · Foster Tech Soluções', 15, 288);
    doc.text(`Página ${i} de ${pageCount}`, 195, 288, {align:'right'});
    doc.setTextColor(0,0,0);
  }
}

let usuarioLogado = null;

async function initAuth(){
  if(!supaOk){
    // modo demo: sem login, entra direto
    document.getElementById('app-shell').classList.remove('hidden');
    render('dashboard');
    return;
  }
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session){
      usuarioLogado = session.user?.email || null;
      aplicarEmpresa(session.empresa, session.user?.papel);
      document.getElementById('app-shell').classList.remove('hidden');
      render('dashboard');
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
    }
  }catch(err){
    console.error('Erro ao verificar sessão:', err);
    document.getElementById('login-screen').classList.remove('hidden');
    const errBox = document.getElementById('login-error');
    errBox.textContent = 'Não foi possível conectar ao banco de dados. Verifique a conexão ou tente novamente.';
    errBox.style.display = 'block';
  }
}

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){
    errBox.textContent = 'E-mail ou senha inválidos.';
    errBox.style.display = 'block';
    return;
  }
  usuarioLogado = data?.session?.user?.email || email;
  aplicarEmpresa(data?.session?.empresa, data?.session?.user?.papel);
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  render('dashboard');
});

  if(supaOk) await supabaseClient.auth.signOut();
  usuarioLogado = null;
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-senha').value = '';

});

// alternar entre entrar e criar conta
function mostrarCadastro(sim){
  document.getElementById('form-login').classList.toggle('hidden', sim);
  document.getElementById('form-cadastro').classList.toggle('hidden', !sim);
  (sim ? document.getElementById('cad-empresa') : document.getElementById('login-email')).focus();
}

    j = await res.json().catch(() => ({}));
  }catch(err){ j = { message: 'Sem conexão com o servidor. Tente de novo.' }; res = { ok: false }; }
  if(!res.ok){ errBox.textContent = j.message || 'Não foi possível criar a conta.'; errBox.style.display = 'block'; return; }

  document.getElementById('app-shell').classList.remove('hidden');
  toast('Conta criada! Comece cadastrando suas ferramentas.');
  document.querySelector('[data-view="ferramentas"]').click();
});

   ====================================================== */
initAuth();

if(location.hash === '#cadastro' && !localStorage.getItem('lo_session')) mostrarCadastro(true);
</script>
