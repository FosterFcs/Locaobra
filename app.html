    <div class="row">
      <div class="field"><label for="${px}-nome">Nome do local / obra</label><input id="${px}-nome" maxlength="80" value="${esc(l.nome)}" placeholder="Ex.: Obra Residencial Alphaville"></div>
      <div class="field"><label for="${px}-cep">CEP</label><input id="${px}-cep" maxlength="9" value="${esc(l.cep)}" placeholder="00000-000"></div>
    </div>

      <div class="field"><label for="${px}-cidade">Cidade</label><input id="${px}-cidade" maxlength="60" value="${esc(l.cidade)}"></div>

function lerCamposLocal(px){

function enderecoLocal(l){
  return [l.endereco, l.bairro, l.cidade, l.cep ? 'CEP ' + l.cep : ''].filter(Boolean).join(' — ');
}
// opções: retirada na loja, endereço do cadastro, obras do cliente, novo local
function preencherLocais(selId, clienteId, atual){
  const sel = document.getElementById(selId); if(!sel) return;
  const cli = DB.clientes.find(c => c.id === clienteId);
  const locais = DB.locais_entrega.filter(l => l.cliente_id === clienteId && l.status !== 'inativo');
  sel.innerHTML = `
    <option value="loja">Cliente retira na loja</option>
    <option value="cadastro">Endereço do cadastro do cliente${cli && cli.endereco ? ' — ' + esc(cli.endereco) : ''}</option>
    ${locais.map(l => `<option value="${l.id}">📍 ${esc(l.nome)} — ${esc(enderecoLocal(l))}</option>`).join('')}
    <option value="__novo">＋ Cadastrar novo local de entrega…</option>`;
  sel.value = atual || (locais[0] ? locais[0].id : 'loja');
  if(!sel.value) sel.value = 'loja';
}
function resolverEntrega(valor, clienteId){
  if(valor === 'cadastro'){
    const cli = DB.clientes.find(c => c.id === clienteId) || {};
    return { local_entrega_id: null, endereco_entrega: 'Endereço do cadastro: ' + ([cli.endereco, cli.cidade].filter(Boolean).join(' — ') || 'não informado') };
  }
  const l = DB.locais_entrega.find(x => x.id === valor);
  if(l){
    const extra = [l.contato ? 'Recebe: ' + l.contato : '', l.telefone ? 'Tel: ' + l.telefone : ''].filter(Boolean).join(' · ');
    return { local_entrega_id: l.id, endereco_entrega: `${l.nome}: ${enderecoLocal(l)}${extra ? ' (' + extra + ')' : ''}` };
  }
  return { local_entrega_id: null, endereco_entrega: 'Retirada na loja pelo cliente' };
}
function valorSelecaoEntrega(loc){
  if(loc.local_entrega_id) return loc.local_entrega_id;
  if(String(loc.endereco_entrega || '').startsWith('Endereço do cadastro')) return 'cadastro';
  return 'loja';
}
function textoEntrega(loc, cliente){
  return loc.endereco_entrega || 'Não informado';
}

function renderLocais(el){
  const opCli = DB.clientes.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  el.innerHTML = `
    ${configNote()}
    <div class="grid grid-2">
      <div class="panel">
        <h2 id="local-titulo">Novo local de entrega</h2>
        <div style="font-size:13px; color:var(--ink-soft); margin-bottom:12px;">Cadastre as obras e endereços de entrega de cada cliente. Um cliente pode ter vários. Na nova locação é só escolher.</div>

          <input type="hidden" id="le-id" value="">

          ${camposLocalHTML('le')}

          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="le-btn">Cadastrar local</button>
            <button type="button" class="btn btn-outline hidden" id="le-cancelar" onclick="render('locais')">Cancelar edição</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>Locais cadastrados <span class="tag">${DB.locais_entrega.length}</span></h2>
        <div class="field"><input id="busca-local" placeholder="Buscar por cliente, obra ou endereço..." oninput="filtrarLocais()"></div>
        <div id="lista-locais">${listaLocaisHTML(DB.locais_entrega)}</div>
      </div>
    </div>`;
  document.getElementById('form-local').addEventListener('submit', async ev => {
    ev.preventDefault();
    const id = document.getElementById('le-id').value;
    const dados = { ...lerCamposLocal('le'), cliente_id: document.getElementById('le-cliente').value, observacoes: document.getElementById('le-obs').value.trim() };
    if(!dados.cliente_id){ toast('Escolha o cliente', false); return; }
    if(!dados.nome || !dados.endereco){ toast('Preencha o nome do local e o endereço', false); return; }
    const r = await gravarLocal(dados, id);
    if(r.error){ toast(r.error.message || 'Erro ao salvar o local', false); return; }
    toast(id ? 'Local atualizado' : 'Local de entrega cadastrado');
    render('locais');

function listaLocaisHTML(list){
  if(!list.length) return `<div class="empty"><div class="display">Nenhum local cadastrado</div></div>`;
  return `<table><thead><tr><th>Cliente</th><th>Local / obra</th><th>Endereço</th><th>Ações</th></tr></thead><tbody>
    ${list.map(l => { const c = DB.clientes.find(x => x.id === l.cliente_id); return `<tr>
      <td>${esc(c ? c.nome : '—')}</td>
      <td><b>${esc(l.nome)}</b>${l.contato ? `<div class="sub-entrega">Recebe: ${esc(l.contato)}${l.telefone ? ' · ' + esc(l.telefone) : ''}</div>` : ''}</td>
      <td>${esc(enderecoLocal(l))}</td>
      <td class="actions-cell">
        <button class="btn btn-outline btn-sm" onclick="editarLocal('${l.id}')">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="excluirLocal('${l.id}')">Excluir</button>
      </td></tr>`; }).join('')}
  </tbody></table>`;
}
function filtrarLocais(){
  const t = document.getElementById('busca-local').value.toLowerCase();
  const f = DB.locais_entrega.filter(l => { const c = DB.clientes.find(x => x.id === l.cliente_id);
    return [(c && c.nome), l.nome, enderecoLocal(l), l.contato].join(' ').toLowerCase().includes(t); });
  document.getElementById('lista-locais').innerHTML = listaLocaisHTML(f);
}
function editarLocal(id){
  const l = DB.locais_entrega.find(x => x.id === id); if(!l) return;
  document.getElementById('le-id').value = l.id;
  document.getElementById('le-cliente').value = l.cliente_id;
  const m = { nome: 'nome', end: 'endereco', bairro: 'bairro', cidade: 'cidade', cep: 'cep', contato: 'contato', tel: 'telefone' };
  Object.entries(m).forEach(([k, c]) => document.getElementById('le-' + k).value = l[c] || '');
  document.getElementById('le-obs').value = l.observacoes || '';
  document.getElementById('local-titulo').textContent = 'Editar local de entrega';
  document.getElementById('le-btn').textContent = 'Salvar alterações';
  document.getElementById('le-cancelar').classList.remove('hidden');
  document.getElementById('form-local').scrollIntoView({ behavior: 'smooth' });
}
async function excluirLocal(id){
  if(!confirm('Excluir este local de entrega? As locações antigas continuam com o endereço gravado.')) return;
  // desvincula das locações antes de excluir
  if(!COMPAT) for(const l of DB.locacoes.filter(x => x.local_entrega_id === id)){
    await supabaseClient.from('locacoes').update({ local_entrega_id: null }).eq('id', l.id);
  }
  const alvo = DB.locais_entrega.find(x => x.id === id);
  const r = await supabaseClient.from(alvo && alvo._compat ? 'clientes' : 'locais_entrega').delete().eq('id', id);
  if(r.error){ toast(r.error.message || 'Erro ao excluir', false); return; }
  toast('Local excluído');
  render('locais');
}

/* ======================================================
   EDITAR LOCAÇÃO (datas, valores, local, forma, observações)
   ====================================================== */
let EDIT_ITENS = []; // [{id|null, ferramenta_id, nome, q, origQ, sub, orig, removido}]
let EDIT_ATIVA = false; // itens só mudam com a locação ativa (estoque fora da loja)
const itensAtivos = () => EDIT_ITENS.filter(i => !i.removido);
function periodoEdicao(){
  const ret = document.getElementById('ed-retirada')?.value, dev = document.getElementById('ed-devolucao')?.value;
  const dias = ret && dev ? Math.max(1, Math.round((new Date(dev) - new Date(ret)) / 86400000)) : 1;
  return { tipo: document.getElementById('ed-tipo')?.value || 'diaria', dias };
}
// estoque livre de uma ferramenta, contando o que já está nesta locação e o que foi mudado aqui
function livreEdicao(fid){
  const f = DB.ferramentas.find(x => x.id === fid); if(!f) return 0;
  let livre = Number(f.quantidade_disponivel || 0);
  EDIT_ITENS.filter(i => i.ferramenta_id === fid).forEach(i => { livre += (i.origQ || 0) - (i.removido ? 0 : i.q); });
  return livre;
}
function renderItensEdicao(){
  const box = document.getElementById('ed-itens'); if(!box) return;
  const ativos = itensAtivos();
  const soma = r2(ativos.reduce((t, i) => t + i.sub, 0));
  const opcoes = DB.ferramentas.filter(f => livreEdicao(f.id) > 0).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'))
    .map(f => `<option value="${f.id}">${esc(f.nome)} (${esc(f.codigo)}) — disp: ${livreEdicao(f.id)}</option>`).join('');
  box.innerHTML = `<table class="tab-itens"><thead><tr><th>Ferramenta</th><th>Qtd</th><th>Valor unit. (R$)</th><th>Subtotal</th>${EDIT_ATIVA ? '<th></th>' : ''}</tr></thead><tbody>
    ${EDIT_ITENS.map((i, k) => i.removido ? '' : `<tr><td>${esc(i.nome)}${!i.id ? ' <span class="badge badge-ok">novo</span>' : ''}</td>
      <td>${EDIT_ATIVA ? `<input class="inp-valor" style="width:70px" type="number" min="1" step="1" value="${i.q}" aria-label="Quantidade de ${esc(i.nome)}" onchange="setQtdEdicao(${k}, this.value)">` : `<span class="mono">${i.q}</span>`}</td>
      <td><input class="inp-valor" type="number" step="0.01" min="0" inputmode="decimal" value="${r2(i.sub / i.q).toFixed(2)}" aria-label="Valor unitário de ${esc(i.nome)}" onchange="setUnitEdicao(${k}, this.value)"></td>
      <td class="mono">${fmtMoney(i.sub)}</td>
      ${EDIT_ATIVA ? `<td><button type="button" class="btn btn-danger btn-sm" onclick="removerItemEdicao(${k})">Retirar</button></td>` : ''}</tr>`).join('')}
    <tr><td colspan="3"><b>Soma dos itens</b></td><td class="mono"><b>${fmtMoney(soma)}</b></td>${EDIT_ATIVA ? '<td></td>' : ''}</tr></tbody></table>
    ${EDIT_ATIVA ? `<div class="ajuste-total">
      <label for="ed-busca">Incluir equipamento</label>
      <input id="ed-busca" type="search" autocomplete="off" placeholder="Buscar por nome, código ou categoria" oninput="filtrarEdicao()" onkeydown="if(event.key==='Enter'){event.preventDefault(); adicionarItemEdicao();}" style="margin-bottom:6px; width:100%;">
      <div class="item-row">
        <select id="ed-add-ferr">${opcoes || '<option value="">Sem estoque disponível</option>'}</select>
        <input id="ed-add-qtd" type="number" class="qty" value="1" min="1" aria-label="Quantidade">
        <button type="button" class="btn btn-dark btn-sm" onclick="adicionarItemEdicao()">Incluir</button>
      </div>
      <div class="sub-entrega">O estoque é ajustado quando você salvar: o que entra sai do estoque, o que é retirado volta.</div>
    </div>` : '<div class="sub-entrega">Esta locação não está ativa: dá para ajustar valores, mas não incluir ou retirar itens.</div>'}`;
  const tot = document.getElementById('ed-total'); if(tot) tot.value = soma.toFixed(2);
}
function filtrarEdicao(){
  const sel = document.getElementById('ed-add-ferr'); if(!sel) return;
  const termos = semAcentoBusca(document.getElementById('ed-busca').value).split(/\s+/).filter(Boolean);
  const lista = DB.ferramentas.filter(f => livreEdicao(f.id) > 0)
    .filter(f => { const alvo = semAcentoBusca([f.nome, f.codigo, f.categoria].join(' ')); return termos.every(t => alvo.includes(t)); })
    .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  sel.innerHTML = lista.length ? lista.map(f => `<option value="${f.id}">${esc(f.nome)} (${esc(f.codigo)}) — disp: ${livreEdicao(f.id)}</option>`).join('') : '<option value="">Nenhum equipamento encontrado</option>';
}
function adicionarItemEdicao(){
  const fid = document.getElementById('ed-add-ferr').value;
  const q = Math.max(1, Math.round(Number(document.getElementById('ed-add-qtd').value) || 1));
  if(!fid){ toast('Escolha o equipamento', false); return; }
  if(q > livreEdicao(fid)){ toast(`Estoque insuficiente: disponível ${livreEdicao(fid)}`, false); return; }
  const f = DB.ferramentas.find(x => x.id === fid);
  const { tipo, dias } = periodoEdicao();
  const unit = r2(calcularItemValor(f, tipo, dias));
  const existente = EDIT_ITENS.find(i => i.ferramenta_id === fid && !i.removido);
  if(existente){ existente.sub = r2(existente.sub + unit * q); existente.q += q; }
  else EDIT_ITENS.push({ id: null, ferramenta_id: fid, nome: f.nome, q, origQ: 0, sub: r2(unit * q), orig: 0, removido: false });
  renderItensEdicao();
  const b = document.getElementById('ed-busca'); if(b) b.focus();
  toast(`${f.nome} incluído`);
}
function setQtdEdicao(k, v){
  const i = EDIT_ITENS[k]; const q = Math.round(Number(v));
  if(!(q >= 1)){ renderItensEdicao(); return; }
  const extra = q - i.q;
  if(extra > 0 && extra > livreEdicao(i.ferramenta_id)){ toast(`Estoque insuficiente: dá para somar no máximo ${livreEdicao(i.ferramenta_id)}`, false); renderItensEdicao(); return; }
  const unit = r2(i.sub / i.q);
  i.q = q; i.sub = r2(unit * q);
  renderItensEdicao();
}
function removerItemEdicao(k){
  if(itensAtivos().length <= 1){ toast('A locação precisa de ao menos um item. Para desfazer tudo, use Cancelar.', false); return; }
  const i = EDIT_ITENS[k];
  if(i.id) i.removido = true; else EDIT_ITENS.splice(k, 1);
  renderItensEdicao();
}
function setUnitEdicao(k, v){
  const i = EDIT_ITENS[k]; const n = Number(String(v).replace(',', '.'));
  if(!(n >= 0)) return;
  i.sub = r2(n * i.q); renderItensEdicao();
}
function distribuirEdicao(){
  const total = r2(document.getElementById('ed-total').value);
  const ativos = itensAtivos();
  if(!(total >= 0) || !ativos.length) return;
  const novos = distribuirTotal(ativos.map(i => i.sub), total, ativos.map(i => i.q));
  ativos.forEach((i, k) => i.sub = novos[k]);
  renderItensEdicao();
  toast(`Total de ${fmtMoney(total)} dividido entre os itens`);
}
// grava as mudanças de itens e de estoque (depois de salvar a locação)
async function salvarItensEdicao(loc, total){
  const ativos = itensAtivos();
  if(Math.abs(ativos.reduce((t, i) => t + i.sub, 0) - total) > 0.009){
    const novos = distribuirTotal(ativos.map(i => i.sub), total, ativos.map(i => i.q));
    ativos.forEach((i, k) => i.sub = novos[k]);
  }
  const ajustaEstoque = async (fid, delta) => { // delta > 0 volta ao estoque
    const f = DB.ferramentas.find(x => x.id === fid); if(!f || !delta) return null;
    const nova = Math.max(0, Math.min(Number(f.quantidade_total || 0), Number(f.quantidade_disponivel || 0) + delta));
    const r = await supabaseClient.from('ferramentas').update({ quantidade_disponivel: nova }).eq('id', fid);
    if(!r.error) f.quantidade_disponivel = nova;
    return r.error;
  };
  // 1. retirados: apaga o item e devolve ao estoque
  for(const i of EDIT_ITENS.filter(x => x.removido && x.id)){
    const r = await supabaseClient.from('itens_locacao').delete().eq('id', i.id);
    if(r.error) return r.error.message || 'Erro ao retirar item';
    const e = await ajustaEstoque(i.ferramenta_id, i.origQ); if(e) return e.message || 'Erro ao devolver estoque';
  }
  // 2. existentes: quantidade e valor
  for(const i of ativos.filter(x => x.id)){
    const mudouQ = i.q !== i.origQ, mudouV = Math.abs(i.sub - i.orig) > 0.009;
    if(!mudouQ && !mudouV) continue;
    if(mudouQ){ const e = await ajustaEstoque(i.ferramenta_id, i.origQ - i.q); if(e) return e.message || 'Erro no estoque'; }
    const r = await supabaseClient.from('itens_locacao').update({ quantidade: i.q, valor_unitario: r2(i.sub / i.q), subtotal: i.sub }).eq('id', i.id);
    if(r.error) return r.error.message || 'Erro ao salvar item';
  }
  // 3. novos: o servidor grava e baixa o estoque (recusa se faltar)
  const novos = ativos.filter(x => !x.id).map(i => ({ locacao_id: loc.id, ferramenta_id: i.ferramenta_id, quantidade: i.q, valor_unitario: r2(i.sub / i.q), subtotal: i.sub }));
  if(novos.length){
    const r = await supabaseClient.from('itens_locacao').insert(novos);
    if(r.error) return r.error.message || 'Erro ao incluir itens';
  }
  return null;
}

/* ======================================================
   RELATÓRIO DO DIA (ou período): contratos feitos, pagamentos
   recebidos, forma de pagamento e usuário
   ====================================================== */
function quemFez(l){ return (l && l.criado_por) || '—'; }
function diaCriacao(l){ return dataBR(l.criado_em); }
function diaPagamento(p){ const d = String(p.data_pagamento || ''); return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : dataBR(d); }
function dadosRelatorio(de, ate, usuario){
  const dentro = d => d >= de && d <= ate;
  const contratos = DB.locacoes.filter(l => dentro(diaCriacao(l)) && (!usuario || quemFez(l) === usuario))
    .sort((a, b) => (a.numero || 0) - (b.numero || 0));
  const pags = DB.pagamentos.filter(p => (p.tipo === 'pagamento' || p.tipo === 'caucao') && dentro(diaPagamento(p)))
    .map(p => ({ ...p, loc: DB.locacoes.find(l => l.id === p.locacao_id) }))
    .filter(p => !usuario || (p.registrado_por || quemFez(p.loc)) === usuario)
    .sort((a, b) => String(a.data_pagamento).localeCompare(String(b.data_pagamento)));
  const porForma = {};
  pags.filter(p => p.tipo === 'pagamento').forEach(p => { const f = p.forma_pagamento || 'Não informada'; porForma[f] = (porForma[f] || 0) + Number(p.valor || 0); });
  const totalContratado = contratos.filter(l => l.status !== 'cancelada').reduce((t, l) => t + Number(l.valor_total || 0), 0);
  const totalRecebido = pags.filter(p => p.tipo === 'pagamento').reduce((t, p) => t + Number(p.valor || 0), 0);
  const totalCaucao = pags.filter(p => p.tipo === 'caucao').reduce((t, p) => t + Number(p.valor || 0), 0);
  return { contratos, pags, porForma, totalContratado, totalRecebido, totalCaucao };
}
function renderRelatorio(el){
  const hoje = todayISO();
  const usuarios = [...new Set(DB.locacoes.map(quemFez).concat(DB.pagamentos.map(p => p.registrado_por).filter(Boolean)))].filter(u => u !== '—').sort();
  el.innerHTML = `
    ${configNote()}
    <div class="panel">

        <div class="field"><label for="rel-usuario">Usuário</label><select id="rel-usuario"><option value="">Todos</option>${usuarios.map(u => `<option>${esc(u)}</option>`).join('')}</select></div>
      </div>
      <div class="actions-cell">
        <button class="btn btn-outline btn-sm" onclick="relRapido(0)">Hoje</button>

        <button class="btn btn-primary btn-sm" onclick="relatorioPDF()">Imprimir / PDF</button>
      </div>
    </div>
    <div id="rel-corpo"></div>`;
  ['rel-de','rel-ate','rel-usuario'].forEach(id => document.getElementById(id).addEventListener('change', atualizarRelatorio));

function relRapido(q){
  const d = new Date(Date.now() - 3 * 3600000);
  const iso = x => x.toISOString().slice(0, 10);
  let de, ate = iso(d);
  if(q === 'mes'){ de = ate.slice(0, 8) + '01'; }
  else if(q === 1){ d.setUTCDate(d.getUTCDate() - 1); de = ate = iso(d); }
  else { const i = new Date(d); i.setUTCDate(i.getUTCDate() - (q ? q - 1 : 0)); de = iso(i); }
  document.getElementById('rel-de').value = de; document.getElementById('rel-ate').value = ate;
  atualizarRelatorio();
}
function filtrosRelatorio(){
  let de = document.getElementById('rel-de').value || todayISO(), ate = document.getElementById('rel-ate').value || de;
  if(ate < de) [de, ate] = [ate, de];
  return { de, ate, usuario: document.getElementById('rel-usuario').value };
}
function atualizarRelatorio(){
  const { de, ate, usuario } = filtrosRelatorio();
  const r = dadosRelatorio(de, ate, usuario);

  document.getElementById('rel-corpo').innerHTML = `
    <div class="grid grid-4" style="margin-bottom:16px;">
      <div class="panel"><div class="sub-entrega">Contratos feitos</div><div class="mono" style="font-size:22px;"><b>${r.contratos.length}</b></div></div>
      <div class="panel"><div class="sub-entrega">Valor contratado</div><div class="mono" style="font-size:20px;"><b>${fmtMoney(r.totalContratado)}</b></div></div>
      <div class="panel"><div class="sub-entrega">Total recebido</div><div class="mono" style="font-size:20px; color:var(--green)"><b>${fmtMoney(r.totalRecebido)}</b></div></div>
      <div class="panel"><div class="sub-entrega">Caução recebida</div><div class="mono" style="font-size:20px;"><b>${fmtMoney(r.totalCaucao)}</b></div></div>
    </div>
    <div class="panel">
      <h2>Recebido por forma de pagamento</h2>
      ${Object.keys(r.porForma).length ? `<table><thead><tr><th>Forma</th><th>Total</th></tr></thead><tbody>
        ${Object.entries(r.porForma).sort((a, b) => b[1] - a[1]).map(([f, v]) => `<tr><td>${esc(f)}</td><td class="mono">${fmtMoney(v)}</td></tr>`).join('')}

    </div>
    <div class="panel">
      <h2>Contratos feitos <span class="tag">${r.contratos.length}</span></h2>
      ${r.contratos.length ? `<table><thead><tr><th>Nº</th><th>Cliente</th><th>Usuário</th><th>Valor</th><th>Forma</th><th>Recebido</th><th>Status</th></tr></thead><tbody>
        ${r.contratos.map(l => { const pago = DB.pagamentos.filter(p => p.locacao_id === l.id && p.tipo === 'pagamento').reduce((t, p) => t + Number(p.valor || 0), 0);

function relatorioPDF(){
  const { de, ate, usuario } = filtrosRelatorio();
  const r = dadosRelatorio(de, ate, usuario);
  const nomeCli = l => { const c = l && DB.clientes.find(x => x.id === l.cliente_id); return c ? c.nome : '—'; };
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const periodo = de === ate ? fmtDate(de) : `${fmtDate(de)} a ${fmtDate(ate)}`;
  let y = desenharCabecalhoPDF(doc, 'RELATÓRIO DO DIA', `Período: ${periodo}${usuario ? ' · Usuário: ' + usuario : ''}`);
  const novaPagina = (alt) => { if(y + alt > 280){ desenharRodapePDF(doc); doc.addPage(); y = 20; } };
  const corta = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`Contratos feitos: ${r.contratos.length}   |   Valor contratado: ${fmtMoney(r.totalContratado)}`, 15, y); y += 6;
  doc.text(`Total recebido: ${fmtMoney(r.totalRecebido)}   |   Caução recebida: ${fmtMoney(r.totalCaucao)}`, 15, y); y += 9;

  doc.setFont('helvetica','bold'); doc.text('RECEBIDO POR FORMA DE PAGAMENTO', 15, y); y += 6; doc.setFont('helvetica','normal');
  const formas = Object.entries(r.porForma).sort((a, b) => b[1] - a[1]);
  if(!formas.length){ doc.text('Nenhum pagamento no período.', 15, y); y += 6; }
  formas.forEach(([f, v]) => { novaPagina(6); doc.text(corta(f, 40), 18, y); doc.text(fmtMoney(v), 120, y); y += 5.5; });
  y += 5;

  const tabela = (titulo, cab, cols, linhas) => {
    novaPagina(20);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(titulo, 15, y); y += 3;
    doc.setFillColor(230,230,230); doc.rect(15, y, 180, 6.5, 'F'); doc.setFontSize(8.5);
    cab.forEach((c, i) => doc.text(c, cols[i], y + 4.5)); y += 6.5; doc.setFont('helvetica','normal');
    if(!linhas.length){ doc.text('Nenhum registro no período.', 17, y + 4.5); y += 8; return; }
    linhas.forEach(l => { novaPagina(6); l.forEach((t, i) => doc.text(String(t), cols[i], y + 4.3)); doc.setDrawColor(225,225,225); doc.line(15, y + 6, 195, y + 6); y += 6; });
    y += 6;
  };
  tabela(`CONTRATOS FEITOS (${r.contratos.length})`, ['Nº', 'Cliente', 'Usuário', 'Valor', 'Forma', 'Status'], [17, 35, 85, 118, 143, 177],
    r.contratos.map(l => [fmtNumero(l), corta(nomeCli(l), 26), corta(quemFez(l), 18), fmtMoney(l.valor_total), corta(l.forma_pagamento || 'A combinar', 18), l.status]));
  tabela(`PAGAMENTOS RECEBIDOS (${r.pags.length})`, ['Data', 'Contrato', 'Cliente', 'Forma', 'Valor', 'Usuário'], [17, 37, 58, 110, 143, 168],
    r.pags.map(p => [fmtDate(diaPagamento(p)).slice(0, 5), p.loc ? fmtNumero(p.loc) : '—', corta(nomeCli(p.loc), 27) + (p.tipo === 'caucao' ? ' (caução)' : ''),
      corta(p.forma_pagamento || '-', 18), fmtMoney(p.valor), corta(p.registrado_por || quemFez(p.loc), 15)]));
  doc.setFontSize(7.5); doc.setTextColor(120,120,120);
  novaPagina(8); doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')} por ${usuarioNome || usuarioLogado || '-'}`, 15, y);
  doc.setTextColor(0,0,0);
  desenharRodapePDF(doc);
  entregarPDF(doc, `relatorio-${de}${de !== ate ? '_a_' + ate : ''}.pdf`, `Relatório — ${periodo}`);
}

      <ol class="pix-passos">

function ligarPainelPix(e){
  const mostrar = () => {
    const v = (document.querySelector('input[name=pix-modo]:checked') || {}).value || '';
    document.getElementById('pix-box-simples').classList.toggle('hidden', v !== 'simples');
    document.getElementById('pix-box-asaas').classList.toggle('hidden', v !== 'asaas');
    const off = document.getElementById('pix-box-off');
    off.classList.toggle('hidden', v !== '');
    if(v === '' && e.pix_modo) off.innerHTML = '<button type="button" class="btn btn-danger" id="pix-desativar">Desativar recebimento por Pix</button>';
    const d = document.getElementById('pix-desativar');
    if(d) d.onclick = () => salvarPix({ modo: null }, 'Pix desativado');
  };
  document.querySelectorAll('input[name=pix-modo]').forEach(r => r.addEventListener('change', mostrar));
  const s = document.getElementById('pix-salvar-simples');
  if(s) s.onclick = () => salvarPix({ modo: 'simples', tipo: document.getElementById('pix-tipo').value, chave: document.getElementById('pix-chave').value,
    nome: document.getElementById('pix-nome').value, cidade: document.getElementById('pix-cidade').value }, 'Pix simples configurado');
  const a = document.getElementById('pix-salvar-asaas');
  if(a) a.onclick = () => {
    const k = document.getElementById('pix-api').value.trim();
    if(!k){ toast('Cole a chave de API do Asaas', false); return; }
    salvarPix({ modo: 'asaas', api_key: k }, 'Asaas conectado');
  };
}
async function salvarPix(corpo, msg){
  const btns = document.querySelectorAll('#pix-salvar-simples, #pix-salvar-asaas, #pix-desativar');
  btns.forEach(b => b.disabled = true);
  const resp = await apiFetch('/api/pix/config', { method: 'POST', body: JSON.stringify(corpo) });
  btns.forEach(b => b.disabled = false);
  if(!resp.ok){ toast(resp.data?.message || 'Erro ao salvar o Pix', false); return; }
  aplicarEmpresa(resp.data);
  toast(resp.data.webhook_criado === false ? 'Asaas conectado. Aviso automático não foi criado: o sistema vai conferir os pagamentos ao abrir a cobrança.' : msg);
  render('empresa');
}

/* ======================================================
   COBRAR POR PIX (uma locação)
   ====================================================== */
let PIX_TIMER = null;
// datas do servidor vêm em UTC; mostra no horário de Brasília
function dataBR(utc){ const d = new Date(String(utc || '').replace(' ', 'T') + (String(utc).includes('Z') ? '' : 'Z')); return isNaN(d) ? String(utc || '').slice(0, 10) : new Date(d.getTime() - 3 * 3600000).toISOString().slice(0, 10); }
function saldoLocacao(loc){
  const pago = DB.pagamentos.filter(p => p.locacao_id === loc.id && p.tipo === 'pagamento').reduce((t, p) => t + Number(p.valor || 0), 0);
  return Math.max(0, Math.round((Number(loc.valor_total || 0) + Number(loc.valor_multa || 0) - pago) * 100) / 100);
}
function fecharPix(){
  clearInterval(PIX_TIMER); PIX_TIMER = null;
  const f = document.getElementById('pix-fundo'); if(f) f.remove();
  document.removeEventListener('keydown', escPix);
}
function escPix(ev){ if(ev.key === 'Escape') fecharPix(); }
async function abrirPix(locId){
  fecharPix();
  const loc = DB.locacoes.find(l => l.id === locId); if(!loc) return;
  const cli = DB.clientes.find(c => c.id === loc.cliente_id);
  const fundo = document.createElement('div');
  fundo.id = 'pix-fundo'; fundo.className = 'pix-fundo';
  fundo.innerHTML = `<div class="pix-caixa" role="dialog" aria-modal="true" aria-labelledby="pix-tit">
    <div class="pix-topo"><div><h2 id="pix-tit">Cobrar por Pix</h2><div style="font-size:13px; color:var(--ink-soft);">Locação #${fmtNumero(loc)} · ${esc(cli ? cli.nome : '')}</div></div>
    <button class="pix-fechar" aria-label="Fechar" onclick="fecharPix()">×</button></div>
    <div id="pix-corpo"><div class="empty">Carregando…</div></div></div>`;
  fundo.addEventListener('click', ev => { if(ev.target === fundo) fecharPix(); });
  document.body.appendChild(fundo);
  document.addEventListener('keydown', escPix);
  await atualizarPix(loc, cli);
}
async function atualizarPix(loc, cli, focoId){
  const corpo = document.getElementById('pix-corpo'); if(!corpo) return;
  const e = EMPRESA;
  if(!e.pix_modo){
    corpo.innerHTML = `<div class="empty" style="padding:14px 0;">O recebimento por Pix ainda não foi configurado.</div>
      ${PAPEL === 'admin' ? `<button class="btn btn-primary" style="width:100%" onclick="fecharPix(); document.querySelector('[data-view=empresa]').click()">Configurar em Minha empresa</button>` : '<div style="font-size:13px; text-align:center;">Peça ao administrador para configurar em Minha empresa.</div>'}`;
    return;
  }
  const r = await apiFetch(`/api/locacoes/${loc.id}/pix`);
  if(!document.getElementById('pix-corpo')) return;
  const lista = r.ok ? r.data : [];
  const pend = lista.find(c => c.status === 'pendente' && (!focoId || c.id === focoId)) || lista.find(c => c.status === 'pendente');
  const hist = lista.filter(c => c !== pend);
  const histHtml = hist.length ? `<div class="pix-hist"><b>Histórico</b>${hist.map(c => `<div><span>${fmtDate(dataBR(c.criado_em))}${c.descricao ? ' · ' + esc(c.descricao) : ''}</span><span class="mono">${fmtMoney(c.valor)} <span class="badge ${c.status === 'paga' ? 'badge-ok' : c.status === 'cancelada' ? 'badge-neutral' : 'badge-warn'}">${c.status}</span></span></div>`).join('')}</div>` : '';
  if(pend){
    let qr = '';
    try{ qr = await gerarQRCodeDataURL(pend.payload); }catch(err){}
    corpo.innerHTML = `
      <div class="pix-valor">${fmtMoney(pend.valor)}</div>
      ${pend.descricao ? `<div style="text-align:center; font-size:13px; color:var(--ink-soft);">${esc(pend.descricao)}</div>` : ''}
      ${qr ? `<img class="pix-qr" src="${qr}" alt="QR Code Pix">` : ''}
      <label for="pix-copia" style="font-size:12px;">Pix copia e cola</label>
      <textarea id="pix-copia" class="pix-copia" readonly>${esc(pend.payload)}</textarea>
      <div class="actions-cell" style="margin-top:8px;">
        <button class="btn btn-outline btn-sm" onclick="copiarPix()">Copiar código</button>
        <button class="btn btn-outline btn-sm" onclick="enviarPixWhatsapp('${loc.id}', '${pend.id}')">Enviar no WhatsApp</button>
        ${pend.fatura_url ? `<a class="btn btn-outline btn-sm" href="${esc(pend.fatura_url)}" target="_blank" rel="noopener">Abrir fatura</a>` : ''}
      </div>
      <div style="margin-top:12px; font-size:13px; padding:10px; border-radius:6px; background:#F7F5F0;">
        ${pend.modo === 'asaas' ? '⏳ Aguardando pagamento. Quando o cliente pagar, a baixa entra sozinha.' : 'Quando o dinheiro cair na sua conta, confirme abaixo para registrar o pagamento.'}
      </div>
      <div class="actions-cell" style="margin-top:10px;">
        ${pend.modo === 'simples' ? `<button class="btn btn-primary" onclick="acaoPix('${loc.id}', '${pend.id}', 'pago')">Confirmar recebimento</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="acaoPix('${loc.id}', '${pend.id}', 'cancelar')">Cancelar cobrança</button>
      </div>
      ${histHtml}`;
    window.__PIX_ATUAL = { loc, cli, pend };
    clearInterval(PIX_TIMER);
    if(pend.modo === 'asaas') PIX_TIMER = setInterval(async () => {
      const rr = await apiFetch(`/api/locacoes/${loc.id}/pix`);
      const c = rr.ok && rr.data.find(x => x.id === pend.id);
      if(c && c.status === 'paga'){ clearInterval(PIX_TIMER); toast(`Pix de ${fmtMoney(c.valor)} recebido!`); await loadAll(); atualizarPix(loc, cli); }
    }, 6000);
    return;
  }
  clearInterval(PIX_TIMER);
  const saldo = saldoLocacao(loc);
  corpo.innerHTML = `
    <form id="form-pix">
      <div class="field"><label for="pix-valor">Valor a cobrar (R$)</label><input id="pix-valor" type="number" step="0.01" min="1" required value="${saldo >= 1 ? saldo.toFixed(2) : ''}"></div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin:-6px 0 10px;">Em aberto nesta locação: <b>${fmtMoney(saldo)}</b></div>
      <div class="field"><label for="pix-desc">Descrição (opcional)</label><input id="pix-desc" maxlength="80" list="pix-sugestoes" placeholder="Ex.: Sinal, Saldo, Multa por atraso">
        <datalist id="pix-sugestoes"><option value="Sinal"><option value="Saldo"><option value="Pagamento total"><option value="Multa por atraso"></datalist></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Gerar Pix</button>
      ${e.pix_modo === 'asaas' ? '<div style="font-size:12px; color:var(--ink-soft); margin-top:8px;">A cobrança é criada na sua conta Asaas e a baixa é automática.</div>' : ''}
    </form>${histHtml}`;
  document.getElementById('form-pix').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Gerando…';
    const resp = await apiFetch(`/api/locacoes/${loc.id}/pix`, { method: 'POST', body: JSON.stringify({
      valor: Number(document.getElementById('pix-valor').value), descricao: document.getElementById('pix-desc').value }) });
    if(!resp.ok){ toast(resp.data?.message || 'Erro ao gerar o Pix', false); btn.disabled = false; btn.textContent = 'Gerar Pix'; return; }
    atualizarPix(loc, cli, resp.data.id);
  });
}
function copiarPix(){
  const t = document.getElementById('pix-copia'); if(!t) return;
  t.select();
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Código Pix copiado'))
    .catch(() => { try{ document.execCommand('copy'); toast('Código Pix copiado'); }catch(e){ toast('Copie o código manualmente', false); } });

function enviarPixWhatsapp(locId, cobId){

// Reduz o logo no navegador para caber no limite do servidor
function reduzirImagem(arquivo, maxL, maxA){
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onerror = reject;
    leitor.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const escala = Math.min(1, maxL / img.width, maxA / img.height);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        const ctx = c.getContext('2d');
        const png = arquivo.type === 'image/png';
        if(!png){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.85));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

function desenharRodapePDF(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1; i<=pageCount; i++){
    doc.setPage(i);
    doc.setDrawColor(220,220,220); doc.setLineWidth(0.2);
    doc.line(15, 282, 195, 282);

/* ======================================================
   ENTREGA DO PDF — abre uma janela com Abrir/Imprimir, Baixar e
   Compartilhar. O Chrome bloqueia downloads automáticos a partir do
   2º arquivo da mesma página, por isso o arquivo não é mais baixado
   sozinho: a pessoa escolhe o que fazer.
   ====================================================== */
let PDF_URL = null;
function fecharPDF(){
  const f = document.getElementById('pdf-fundo'); if(f) f.remove();
  if(PDF_URL){ const u = PDF_URL; PDF_URL = null; setTimeout(() => URL.revokeObjectURL(u), 60000); }
  document.removeEventListener('keydown', escPDF);
}
function escPDF(ev){ if(ev.key === 'Escape') fecharPDF(); }
function entregarPDF(doc, nomeArquivo, titulo){
  fecharPDF();
  const blob = doc.output('blob');
  const arquivo = (() => { try{ return new File([blob], nomeArquivo, { type: 'application/pdf' }); }catch(e){ return null; } })();
  PDF_URL = URL.createObjectURL(blob);
  const podeCompartilhar = !!(arquivo && navigator.canShare && navigator.canShare({ files: [arquivo] }));
  const celular = window.matchMedia('(max-width:768px)').matches;
  const fundo = document.createElement('div');
  fundo.id = 'pdf-fundo'; fundo.className = 'pix-fundo';
  fundo.innerHTML = `<div class="pix-caixa pdf-caixa" role="dialog" aria-modal="true" aria-labelledby="pdf-tit">
    <div class="pix-topo"><div><h2 id="pdf-tit">${esc(titulo)}</h2><div style="font-size:13px; color:var(--ink-soft);">Documento pronto. Escolha o que fazer:</div></div>
    <button class="pix-fechar" aria-label="Fechar" onclick="fecharPDF()">×</button></div>
    ${celular ? '' : `<iframe class="pdf-previa" src="${PDF_URL}" title="Pré-visualização do PDF"></iframe>`}
    <div class="pdf-acoes">
      <a class="btn btn-primary" href="${PDF_URL}" target="_blank" rel="noopener">Abrir / Imprimir</a>
      <a class="btn btn-dark" href="${PDF_URL}" download="${esc(nomeArquivo)}">Baixar PDF</a>
      ${podeCompartilhar ? '<button type="button" class="btn btn-outline" id="pdf-compartilhar">Compartilhar (WhatsApp…)</button>' : ''}
    </div></div>`;
  fundo.addEventListener('click', ev => { if(ev.target === fundo) fecharPDF(); });
  document.body.appendChild(fundo);
  document.addEventListener('keydown', escPDF);
  const bt = document.getElementById('pdf-compartilhar');
  if(bt) bt.addEventListener('click', () => navigator.share({ files: [arquivo], title: titulo }).catch(() => {}));
}

let usuarioLogado = null;
let usuarioNome = null; // nome do usuário (aparece nos relatórios); se vazio, usa o e-mail

async function initAuth(){
  if(!supaOk){
    // modo demo: sem login, entra direto
    document.getElementById('app-shell').classList.remove('hidden');
    render('dashboard');
    return;
  }
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session){
      usuarioLogado = session.user?.email || null;
      usuarioNome = session.user?.nome || null;
      aplicarEmpresa(session.empresa, session.user?.papel);
      document.getElementById('app-shell').classList.remove('hidden');
      render('dashboard');
    } else {
      document.getElementById('login-screen').classList.remove('hidden');
    }
  }catch(err){
    console.error('Erro ao verificar sessão:', err);
    document.getElementById('login-screen').classList.remove('hidden');
    const errBox = document.getElementById('login-error');
    errBox.textContent = 'Não foi possível conectar ao banco de dados. Verifique a conexão ou tente novamente.';
    errBox.style.display = 'block';
  }
}

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){
    errBox.textContent = 'E-mail ou senha inválidos.';
    errBox.style.display = 'block';
    return;
  }
  usuarioLogado = data?.session?.user?.email || email;
  usuarioNome = data?.session?.user?.nome || null;
  aplicarEmpresa(data?.session?.empresa, data?.session?.user?.papel);
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  render('dashboard');
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  if(supaOk) await supabaseClient.auth.signOut();
  usuarioLogado = null;
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-senha').value = '';
  document.getElementById('form-cadastro').reset();
  mostrarCadastro(false);
});

// alternar entre entrar e criar conta
function mostrarCadastro(sim){
  document.getElementById('form-login').classList.toggle('hidden', sim);
  document.getElementById('form-cadastro').classList.toggle('hidden', !sim);
  (sim ? document.getElementById('cad-empresa') : document.getElementById('login-email')).focus();
}
document.getElementById('ir-cadastro').addEventListener('click', () => mostrarCadastro(true));
document.getElementById('ir-login').addEventListener('click', () => mostrarCadastro(false));

document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('cad-error');
  errBox.style.display = 'none';
  const corpo = {
    empresa_nome: document.getElementById('cad-empresa').value.trim(),
    nome: document.getElementById('cad-nome').value.trim(),
    telefone: document.getElementById('cad-telefone').value.trim(),
    cidade: document.getElementById('cad-cidade').value.trim(),
    email: document.getElementById('cad-email').value.trim(),
    password: document.getElementById('cad-senha').value
  };
  let res, j;
  try{
    res = await fetch(`${API_BASE_URL}/api/cadastro`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    j = await res.json().catch(() => ({}));
  }catch(err){ j = { message: 'Sem conexão com o servidor. Tente de novo.' }; res = { ok: false }; }
  if(!res.ok){ errBox.textContent = j.message || 'Não foi possível criar a conta.'; errBox.style.display = 'block'; return; }
  localStorage.setItem('lo_session', j.token);
  usuarioLogado = j.user.email;
  usuarioNome = j.user.nome || null;
  aplicarEmpresa(j.empresa, j.user.papel);
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  toast('Conta criada! Comece cadastrando suas ferramentas.');
  document.querySelector('[data-view="ferramentas"]').click();
});

/* ======================================================
   INIT
   ====================================================== */
initAuth();
// link "app.html#cadastro" (da página inicial) abre direto o cadastro da locadora
if(location.hash === '#cadastro' && !localStorage.getItem('lo_session')) mostrarCadastro(true);
</script>

    }
    var lx=a+m, s=L, k=s/100;
    var logo = '<g transform="translate('+lx+' '+lx+') scale('+k+')">'+
      '<rect x="-6" y="-6" width="112" height="112" rx="22" fill="#fff"/>'+
      '<rect width="100" height="100" rx="20" fill="#111"/>'+
      '<path d="M24 30 L10 50 L24 70" stroke="#e53935" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M76 30 L90 50 L76 70" stroke="#e53935" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<path d="M40 74 V27 H64 M40 49 H59" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="square"/></g>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" shape-rendering="crispEdges">'+
      '<rect width="'+t+'" height="'+t+'" fill="#fff"/><path d="'+d+'" fill="#000"/>'+logo+'</svg>';
  }

  var btn = document.createElement("button");
  btn.id="fqr-btn"; btn.type="button"; btn.setAttribute("aria-label","Compartilhar por QR Code");
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 20h4v-3"/></svg>Compartilhar';

  var ov = document.createElement("div");
  ov.id="fqr-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  ov.innerHTML='<button id="fqr-x" type="button" aria-label="Fechar">✕</button>'+
    '<h2></h2><p class="fqr-sub">Aponte a câmera do celular para o código</p>'+
    '<div id="fqr-code"></div><div class="fqr-url"></div>'+
    '<div class="fqr-acts"><button id="fqr-wa" type="button">Enviar no WhatsApp</button>'+
    '<button id="fqr-sh" type="button">Compartilhar link</button></div>'+
    '<div class="fqr-sig">© '+new Date().getFullYear()+' Foster Tech Soluções 🇧🇷</div>';

  function montar(){
    if(C.botao!==false) document.body.appendChild(btn);
    document.body.appendChild(ov);
    ov.querySelector("h2").textContent = app;
    ov.querySelector(".fqr-url").textContent = urlVisivel;
    if(!navigator.share) ov.querySelector("#fqr-sh").textContent = "Copiar link";
  }
  var wake=null;
  var feito=false;
  function desenhar(){
    var box=ov.querySelector("#fqr-code");
    try{ box.innerHTML = svgQR(linkQR); feito=true; }catch(e){ box.textContent="Não foi possível gerar o QR."; }
  }
  function gerar(){
    if(feito) return;
    if(typeof qrcode!=="undefined") return desenhar();
    var sc=document.createElement("script"); sc.src=C.lib||"qrcode.min.js";
    sc.onload=desenhar; sc.onerror=function(){ ov.querySelector("#fqr-code").textContent="Sem conexão para gerar o QR."; };
    document.head.appendChild(sc);
  }
  function abrir(){ gerar(); ov.classList.add("on"); document.documentElement.style.overflow="hidden";
    try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){wake=w;}).catch(function(){}); }catch(e){} }
  function fechar(){ ov.classList.remove("on"); document.documentElement.style.overflow="";
    try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

  btn.addEventListener("click",abrir);
  ov.addEventListener("click",function(e){
    var id=e.target.id;
    if(id==="fqr-x") fechar();
    else if(id==="fqr-wa"){
      var msg=(C.frase||("Conheça o app "+app+":"))+" "+linkWA;
      window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
    } else if(id==="fqr-sh"){
      if(navigator.share) navigator.share({title:app,text:(C.frase||("Conheça o app "+app+":")),url:linkSH}).catch(function(){});
      else if(navigator.clipboard) navigator.clipboard.writeText(linkSH).then(function(){ e.target.textContent="Link copiado ✓"; });
    }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") fechar(); });
  window.FosterQR = { abrir:abrir, fechar:fechar };   // para abrir por outro botão: onclick="FosterQR.abrir()"

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",montar); else montar();
})();
</script>
